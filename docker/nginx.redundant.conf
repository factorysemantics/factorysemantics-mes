# The one address in front of a plant's nodes.
#
# Both nodes of a redundant plant serve the whole dashboard, and sessions are
# signed tokens rather than server memory, so a request may go to either one
# and nobody is asked to sign in again when one of them dies. There are no
# sticky sessions here on purpose.
#
# `nodes` is a network alias both node containers answer to, so Docker's
# embedded DNS returns one address per *running* node. Re-resolving it on a
# short TTL through a variable - rather than naming the two containers in a
# static `upstream` block - is what lets this proxy start before the second
# node exists and keep serving after one of them is killed. nginx keeps the
# addresses it resolved for up to the TTL, which is why the retry below
# matters: for a few seconds after a node dies its address is still in the
# list, the connection is refused, and the request is passed to the other one
# instead of becoming a 502 on somebody's screen.

events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=2s ipv6=off;   # Docker's embedded DNS

  server {
    listen 80;

    location / {
      set $nodes http://nodes:8010;        # variable => resolved per request
      proxy_pass $nodes;

      # A dead node is a connection refused, not an answer: try the other.
      proxy_next_upstream     error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_connect_timeout   2s;
      proxy_read_timeout      60s;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
