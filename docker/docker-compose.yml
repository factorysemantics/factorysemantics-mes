# The whole twin at scale: PostgreSQL, a one-shot migration job, N API
# replicas behind nginx, and the three workers.
#
#   docker compose -f docker/docker-compose.yml up --build
#   docker compose -f docker/docker-compose.yml up -d --scale api=3
#
# Dashboard http://localhost:8000/dashboard · API docs /docs · mock ERP :8001

name: mes-twin

x-mes: &mes
  build:
    context: ..
    dockerfile: docker/Dockerfile
  environment: &mes-env
    MES_DATABASE_URL: postgresql+psycopg://mes:mes@postgres:5432/mes_twin
    MES_OPC_ENDPOINT: opc.tcp://opc-sim:4840/mes-twin/sim
    MES_ERP_BASE_URL: http://mock-erp:8001
    MES_LOG_LEVEL: INFO
    # Shared so every API replica accepts the same sessions. Change it (and the
    # passwords) for anything beyond a local trial.
    MES_SECRET_KEY: ${MES_SECRET_KEY:-change-me-in-production}
    MES_ADMIN_PASSWORD: ${MES_ADMIN_PASSWORD:-admin}
    MES_OPERATOR_PASSWORD: ${MES_OPERATOR_PASSWORD:-operator}
    MES_SIM_SPEED: ${MES_SIM_SPEED:-3}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mes
      POSTGRES_PASSWORD: mes
      POSTGRES_DB: mes_twin
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mes -d mes_twin"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Runs once and exits. Keeping migrations out of the API container is what
  # lets the API scale: N replicas must not race each other to migrate.
  migrate:
    <<: *mes
    command: sh -c "fsmes init-db && fsmes seed"
    restart: "no"

  api:
    <<: *mes
    command: fsmes run-api --host 0.0.0.0
    # No published port — nginx fronts the replicas. Scale freely.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8000:80"
    depends_on:
      api:
        condition: service_healthy

  opc-sim:
    <<: *mes
    environment:
      <<: *mes-env
      MES_OPC_ENDPOINT: opc.tcp://0.0.0.0:4840/mes-twin/sim  # server binds all interfaces
    command: fsmes run-opc-sim
    depends_on: {}

  opc-agent:
    <<: *mes
    command: fsmes run-opc-agent
    depends_on:
      migrate:
        condition: service_completed_successfully
      opc-sim:
        condition: service_started

  mock-erp:
    <<: *mes
    command: fsmes run-mock-erp --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on: {}

  erp-sync:
    <<: *mes
    command: fsmes run-erp-sync
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-erp:
        condition: service_started

volumes:
  pgdata:
