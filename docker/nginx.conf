# Load balancer in front of the MES API.
#
# The API is stateless (sessions are signed tokens, not server memory), so
# requests can go to any replica. Re-resolving `api` through Docker's embedded
# DNS on a short TTL is what makes `--scale api=N` work without a restart:
# new replicas join the rotation as soon as DNS reports them.

events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=5s ipv6=off;   # Docker's embedded DNS

  server {
    listen 80;

    location / {
      set $api http://api:8000;            # variable => resolved per request
      proxy_pass $api;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    60s;
    }
  }
}
