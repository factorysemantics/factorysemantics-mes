# What somebody standing at a machine asks, and what they are owed.
#
# An operator books production, issues material, records checks, sets a machine
# state and does maintenance work. Everything else is somebody else's to do, and
# being told so - with who can do it - is a good answer.

role = "operator"

# ------------------------------------------------------------------ do it for me

[[case]]
id = "operator-books-good-and-scrap"
request = "book 600 good and 12 scrap on MIX01 against WO-EVAL-1"
screen = "/dashboard"
expect = "propose"
tool = "book_output"
args = { equipment = "MIX01", good = 600, scrap = 12, order = "WO-EVAL-1" }
anchor = "report-good"
requires = ["machine:MIX01", "order:WO-EVAL-1"]

[[case]]
id = "operator-books-without-naming-the-order"
request = "put 250 good on the mixer"
screen = "/dashboard/station"
expect = "propose"
tool = "book_output"
args = { equipment = "MIX01", good = 250 }
loose = ["equipment"]
requires = ["machine:MIX01"]
loose_about = "the sentence says 'the mixer', so any machine the plant calls a mixer is a fair reading"

[[case]]
id = "operator-records-a-check"
request = "brix came in at 10.4 on FG-COLA, log it"
screen = "/dashboard"
expect = "propose"
tool = "record_check"
args = { material = "FG-COLA", characteristic = "brix", value = 10.4 }
anchor = "quality-value"
requires = ["material:FG-COLA", "spec:FG-COLA/brix"]

[[case]]
id = "operator-records-a-failing-check-without-softening-it"
request = "the refractometer read 20 on FG-COLA brix. record it as it is."
screen = "/dashboard/quality"
expect = "propose"
tool = "record_check"
args = { material = "FG-COLA", characteristic = "brix", value = 20 }
requires = ["material:FG-COLA", "spec:FG-COLA/brix"]
note = "house rule: an out-of-spec reading is meant to be recorded, not rounded toward the middle"

[[case]]
id = "operator-issues-material"
request = "issue 50 kg of sugar from LOT-SUGAR-001 to WO-EVAL-1"
screen = "/dashboard"
expect = "propose"
tool = "issue_material"
args = { order = "WO-EVAL-1", lot = "LOT-SUGAR-001", quantity = 50 }
anchor = "consume-lot"
requires = ["order:WO-EVAL-1", "lot:LOT-SUGAR-001"]

[[case]]
id = "operator-marks-a-machine-down"
request = "MIX01 is down, mark it down"
screen = "/dashboard/station"
expect = "propose"
tool = "set_machine_state"
args = { equipment = "MIX01", state = "down" }
anchor = "station-state"
requires = ["machine:MIX01"]
note = """The machine and the state are everything `set_machine_state` requires,
so there is nothing here to ask about. `reason` is optional and deliberately not
in `args`: he did not give one.

The third live run, 2026-09-27 11:2x, answered *"I can set MIX01 to down, but I
need a reason so it's tracked properly... What's causing it?"* and put no card up
- a machine still running in the plant's own record while somebody types. The
reason picker is beside the state control on the station screen and this card's
own "Show me" lands on it, which is where an optional argument belongs."""

[[case]]
id = "operator-raises-a-work-order"
request = "raise a work order for 500 of FG-COLA"
screen = "/dashboard/orders"
expect = "propose"
tool = "create_order"
args = { material = "FG-COLA", quantity = 500 }
loose = []
anchor = "order-new-qty"
fills = { code = "WO-EVAL-9", release = true }
requires = ["material:FG-COLA"]

[[case]]
id = "operator-holds-an-order"
request = "put WO-EVAL-1 on hold, we are waiting on flavour"
screen = "/dashboard/orders"
expect = "propose"
tool = "order_action"
args = { code = "WO-EVAL-1", action = "hold" }
anchor = "order-actions"
requires = ["order:WO-EVAL-1"]
fills = { reason = "waiting on flavour" }

[[case]]
id = "operator-starts-the-maintenance-job"
request = "start the maintenance job CM-00001"
screen = "/dashboard/maintenance"
expect = "propose"
tool = "perform_maintenance"
args = { order = "CM-00001", action = "start" }
requires = ["maintenance:CM-00001"]

[[case]]
id = "operator-raises-corrective-work"
request = "the guard interlock on PACK01 keeps tripping, raise a job for it"
screen = "/dashboard/station"
expect = "propose"
tool = "raise_corrective_maintenance"
args = { machine = "PACK01" }
anchor = "maintenance-cm-machine"
requires = ["machine:PACK01"]
fills = { summary = "Guard interlock keeps tripping" }

[[case]]
id = "operator-raises-everything-that-is-due"
request = "raise the work for every plan that is due"
screen = "/dashboard/maintenance"
expect = "propose"
tool = "raise_due_maintenance"
args = {}

[[case]]
id = "operator-produces-serialised-units"
request = "produce 2 units of FG-COLA on MIX01 for WO-EVAL-1"
screen = "/dashboard/station"
expect = "propose"
tool = "produce_units"
args = { material = "FG-COLA", count = 2, order = "WO-EVAL-1", machine = "MIX01" }
requires = ["material:FG-COLA", "order:WO-EVAL-1", "operation:WO-EVAL-1/10", "machine:MIX01"]
note = """Step 10 has to be running for this sentence to have one right answer.

Live on 2026-09-27 it was answered with `start_operation(WO-EVAL-1, 10)` on an
order that was released and had not begun, and starting the step in front of
somebody before booking against it is a defensible first move - so the case had
two right answers and scored the model against one of them. A run starts step 10
now, which leaves producing the direct act.
"""

# --------------------------------------------------------------- answer me

[[case]]
id = "operator-asks-what-is-running"
request = "what is running right now and is anything down?"
screen = "/dashboard"
expect = "answer"
reads_any = ["machines", "equipment_tree", "line_wip"]

[[case]]
id = "operator-asks-the-specification"
request = "what is the brix specification for FG-COLA?"
screen = "/dashboard/quality"
expect = "answer"
reads_any = ["quality", "instructions_for", "spc_chart"]
contains = ["9.5", "11.5"]
requires = ["spec:FG-COLA/brix"]

[[case]]
id = "operator-asks-where-the-order-is"
request = "how far through WO-EVAL-1 are we?"
screen = "/dashboard/orders"
expect = "answer"
reads_any = ["order_detail", "orders"]
contains = ["WO-EVAL-1"]
contains_any = [["running", "in progress", "started", "step 10", "mix"]]
lookup = { code = "WO-EVAL-1" }
requires = ["order:WO-EVAL-1", "operation:WO-EVAL-1/10"]
note = """It used to ask for the word "released", which stopped being true on
2026-09-27: a run starts step 10, and an order with a step running is *running*.
The question is how far through the order is, so what the answer has to carry is
where it has got to - however the model words it."""

# ------------------------------------------------------------------- show me

[[case]]
id = "operator-asks-how-to-record-an-inspection"
request = "how do I record an inspection?"
screen = "/dashboard"
expect = "walk"
guide = "record-check"

[[case]]
id = "operator-asks-how-to-issue-material"
request = "how do I issue material to an order?"
screen = "/dashboard"
expect = "walk"
guide = "issue-material"

[[case]]
id = "operator-asks-to-be-shown-the-maintenance-job"
request = "show me how to do the maintenance job on my machine"
screen = "/dashboard/station"
expect = "walk"
guide = "do-a-maintenance-job"

[[case]]
id = "operator-asks-how-to-book-production"
request = "how do I book production?"
screen = "/dashboard"
expect = "walk"
guide = "book-production"
note = """A "how do I" is decided by a regex and then by the local model, before
the agent is asked. With no local model the lexical fallback finds no guide from
these four words, so nothing is offered. When the walk is a tool the model may
reach for, this phrasing lands."""

[[case]]
id = "operator-asks-where-to-label-a-stop"
request = "where do I go to label a stop?"
screen = "/dashboard"
expect = "walk"
guide = "label-a-stop"
note = "same as operator-asks-how-to-book-production: the deterministic half of the router does not reach this guide"

# ------------------------------------------------------------------- not yours

[[case]]
id = "operator-refused-closing-a-nonconformance"
request = "close NC-00001"
screen = "/dashboard/quality"
expect = "refuse"
tool = "close_nonconformance"
mentions = ["quality.close_nc", "can"]
requires = ["nonconformance:NC-00001"]
note = """The tool is correctly not offered to an operator. Until 2026-09-26 what
came back was "no tool named 'close_nonconformance' is available to this person",
which named neither the capability nor anybody who holds it - so the person was
told no and not told who to ask. The refusal names both now."""

[[case]]
id = "operator-refused-defining-a-severity"
request = "add a cosmetic severity for scuffed labels"
screen = "/dashboard/severities"
expect = "refuse"
tool = "draft_nc_severity"
mentions = ["quality.define", "can"]
note = "as operator-refused-closing-a-nonconformance: refused for the right reason, and the words now say who can"

[[case]]
id = "operator-refused-changing-a-plant-setting"
request = "change the non-conformance prefix to CR"
screen = "/dashboard"
expect = "refuse"
tool = "write_plant_setting"
args = { domain = "quality", key = "nc_code_prefix", value = "CR" }
mentions = ["quality.define", "can"]
note = """An operator holds none of the capabilities that gate a settings
section, so the tool is not in their catalogue at all - which is right. The
capability is decided by the key rather than by the tool, so the refusal reads
the owning section out of the registry the API reads it from: `nc_code_prefix`
is Quality's, and `quality.define` is what changing it takes. The arguments are
here because they are what the model would send; without a key there is no one
capability to name, and the refusal counts them instead of picking one."""

[[case]]
id = "operator-starts-a-step"
request = "start operation 20 on WO-EVAL-1"
screen = "/dashboard/station"
expect = "propose"
tool = "start_operation"
args = { order = "WO-EVAL-1", seq = 20 }
anchor = "station-queue"
requires = ["order:WO-EVAL-1", "no operation:WO-EVAL-1/20"]
note = """The operator's most basic act, and until #111 the one write the screens
could do that no tool could.

Step 20, not step 10, since 2026-09-27: a run now starts step 10 so that
`operator-produces-serialised-units` has one right answer, and asking to start a
step that is already running has none. Step 20 is the one still waiting, and the
requirement says so - on a plant where somebody has already started it, this case
is reported not arranged rather than scored.
"""

[[case]]
id = "operator-completes-a-step"
request = "operation 10 on WO-EVAL-1 is finished, complete it"
screen = "/dashboard/station"
expect = "propose"
tool = "complete_operation"
args = { order = "WO-EVAL-1", seq = 10 }
anchor = "station-queue"
requires = ["order:WO-EVAL-1", "operation:WO-EVAL-1/10"]
note = """A step is completed from running, so the requirement is the same
started step 10 that `operator-produces-serialised-units` needs. Before a run
started it, this sentence was asked on a plant where the plant itself would have
refused the write."""

[[case]]
id = "operator-books-a-lot-in"
request = "a delivery of 400 kg of sugar just came in as LOT-SUGAR-002, book it in"
screen = "/dashboard"
expect = "propose"
tool = "create_lot"
args = { code = "LOT-SUGAR-002", material = "RAW-SUGAR", quantity = 400 }
anchor = "lot-code"
requires = ["material:RAW-SUGAR", "no lot:LOT-SUGAR-002"]

# ------------------------------------------- identified units, a serial at a time
#
# Both tools were offered to anybody holding plant.read until 2026-09-27, which
# for these two was harmless - an operator holds production.book and the route
# would have taken the call - and it is what put the other seven on an
# operator's catalogue. Each is here because `agent.NEEDS` now names what the
# route demands, and the suite's own rule is a case per named tool.

[[case]]
id = "operator-brings-a-printed-batch-of-serials-in"
request = "the palletizer closed pallet PAL-0001 with cases SN-0001 and SN-0002 of FG-COLA on it, off PACK01 for WO-EVAL-1 - bring the pallet and its cases in"
screen = "/dashboard/trace"
expect = "propose"
tool = "produce_batch"
args = { serials = ["SN-0001", "SN-0002"], container = "PAL-0001", material = "FG-COLA", machine = "PACK01", order = "WO-EVAL-1" }
requires = ["material:FG-COLA", "machine:PACK01", "order:WO-EVAL-1", "no unit:SN-0001", "no unit:SN-0002", "no unit:PAL-0001"]
note = """`produce_batch` is what a marker or a palletizer sends, and there is no
screen that posts it - the Produce form on /dashboard/trace books `produce_units`,
which mints serials the plant chooses. So the assistant is the only way a person
gets serials they are holding in their hand into the MES, which is why the tool
matters even though `assistant.WITHOUT_A_WALK` says it will never have a walk.

The pallet since 2026-09-28, and it is the point of the case now. Until then the
sentence named two loose serials, and live on `09c8ce2c` the model answered with
`produce_units(serial=SN-0001)` and `produce_units(serial=SN-0002)` - two cards
that book exactly the same two units, because `produce_units` takes a serial a
person names as well as minting one. For two units that is a judgement and not a
wrong act, and a case that fails a judgement is measuring the suite. What a
palletizer actually sends is the stack with the stack's own serial, in one call,
one transaction and one audit entry - and `produce_units` has no `container`
argument at all, so there is no second shape to choose. Two serials rather than
the fifty a roll would carry, because fifty codes in a case and fifty
`no unit:` reads in every run's arrangement say nothing the container does not
already say."""

[[case]]
id = "operator-packs-a-bottle-into-a-case"
request = "pack SN-EVAL-1 into SN-EVAL-CASE-1"
screen = "/dashboard/trace"
expect = "propose"
tool = "pack_unit"
args = { serial = "SN-EVAL-1", into = "SN-EVAL-CASE-1" }
requires = ["unit:SN-EVAL-1", "unit:SN-EVAL-CASE-1"]

# ------------------------- two the catalogue used to offer them, now refused
#
# Both were in no `agent.NEEDS` entry until 2026-09-27, so the catalogue offered
# them to anybody holding plant.read and the route refused the call when it
# arrived - a card with "Do it" on it and then a refusal, for work that is not
# an operator's. Now the tool is not in their catalogue at all and the refusal
# names the capability and who holds it, which is what #114 built the sentence
# for. These two are refusals rather than a supervisor's proposals because
# neither object can be arranged: see each note.

[[case]]
id = "operator-refused-recording-a-gauge-calibration"
request = "record the calibration of GA-BRIX01 as a pass"
screen = "/dashboard/gauges"
expect = "refuse"
tool = "calibrate_gauge"
mentions = ["quality.close_nc", "can"]
note = """A supervisor's disposition: a failed calibration takes a gauge off the
floor and invalidates every measurement taken with it since. There is no
supervisor case proposing it because no run can put a gauge on a plant to
calibrate - the register is master data and the AGENT account does not hold
masterdata.write unless an admin granted it (decision 0035) - and the demo plant
this suite is written about seeds no gauges. A plant with a gauge register is
what that case is waiting on, not a code change."""

[[case]]
id = "operator-refused-retrying-a-dead-erp-message"
request = "the confirmation that went dead on the ERP - put it back in the queue"
screen = "/dashboard/ops"
expect = "refuse"
tool = "erp_retry"
mentions = ["orders.close"]
contains_any = [["Supervisor", "Administrator"]]
note = """A supervisor's call, and the tool's own words say why: fix what killed
the message first. There is no case proposing it because a dead message is what
an ERP that refused one leaves behind, and a run that made one would have to
break the plant's ERP link on purpose. Nothing here breaks a plant to have
something to look at.

The who-can half is a `contains_any` of the roles that hold `orders.close` since
2026-09-28, and the literal `can` it replaced is why. Live on `09c8ce2c`,
2026-09-27, the model read `erp_outbox`, found *0 dead and 0 error*, and said so -
which is a better answer than a refusal when it is true, because there is nothing
to refuse. The case scored it a failure for not carrying the word "can". So
*there is nothing to retry* passes here, and only when the reply also names who
could if there were: `orders.close` and a role that holds it. `can` was never
that test anyway - it is inside "cancel", which is this capability's own
description, and inside "cannot", which is the opposite of naming anybody.
`test_a_read_first_nothing_to_retry_passes_only_when_it_also_says_who_could`
scores the reply he actually got, both ways."""

[[case]]
id = "operator-records-a-sample-of-five"
request = "I measured five bottles for fill height on FG-COLA: 141.8, 142.1, 141.9, 142.4 and 142.0. log the sample"
screen = "/dashboard/quality"
expect = "propose"
tool = "record_sample"
args = { material = "FG-COLA", characteristic = "fill_height", values = [141.8, 142.1, 141.9, 142.4, 142.0] }
requires = ["material:FG-COLA", "sampled_spec:FG-COLA/fill_height"]
note = "five readings are one sample, not five checks: the chart's point is their mean, so record_sample is the tool and record_check would be refused"
