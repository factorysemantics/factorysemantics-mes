# A supervisor closes what the floor opens: orders, non-conformances, and the
# first draft of the plant's own words. They may not approve their own drafts.

role = "supervisor"

[[case]]
id = "supervisor-closes-a-nonconformance"
request = "close NC-00001, the batch was scrapped"
screen = "/dashboard/quality"
expect = "propose"
tool = "close_nonconformance"
args = { code = "NC-00001" }
requires = ["nonconformance:NC-00001"]

[[case]]
id = "supervisor-takes-a-nonconformance-under-review"
request = "put NC-00001 under review, I want to look at it myself"
screen = "/dashboard/quality"
expect = "propose"
tool = "review_nonconformance"
args = { code = "NC-00001" }
requires = ["nonconformance:NC-00001"]

[[case]]
id = "supervisor-dispositions-a-nonconformance"
request = "scrap NC-00001 - brix was miles out"
screen = "/dashboard/quality"
expect = "propose"
tool = "disposition_nonconformance"
args = { code = "NC-00001", disposition = "scrap" }
fills = { reason = "brix was miles out of specification" }
requires = ["nonconformance:NC-00001"]

[[case]]
id = "supervisor-closes-an-order"
request = "close WO-EVAL-1, it is finished"
screen = "/dashboard/orders"
expect = "propose"
tool = "order_action"
args = { code = "WO-EVAL-1", action = "close" }
anchor = "order-actions"
requires = ["order:WO-EVAL-1"]

[[case]]
id = "supervisor-drafts-a-work-instruction"
request = "draft a work instruction WI-BRIX called Measuring brix, for FG-COLA brix: use the refractometer at the sample port"
screen = "/dashboard/instructions"
expect = "propose"
tool = "draft_instruction"
args = { code = "WI-BRIX", material = "FG-COLA", characteristic = "brix" }
loose = []
fills = { title = "Measuring brix", body = "Use the refractometer at the sample port." }
requires = ["material:FG-COLA", "no instruction:WI-BRIX"]
note = """Drafting needs the code *not* to be there. The instruction a run puts
up for the cases that revise and approve one is `WI-EVAL-1`, precisely so that
this case still has a code nobody has used - and on a plant that already has a
WI-BRIX, this is reported not arranged rather than scored against a model that
correctly said it exists."""

[[case]]
id = "supervisor-drafts-a-controlled-document"
request = "start a controlled document SOP-MIX titled Mixing"
screen = "/dashboard/instructions"
expect = "propose"
tool = "create_document"
args = { code = "SOP-MIX", title = "Mixing" }

[[case]]
id = "supervisor-drafts-a-trigger"
request = "draft a trigger TR-HOT: if MIX01 temp goes above 85 raise corrective work"
screen = "/dashboard/triggers"
expect = "propose"
tool = "draft_trigger"
args = { code = "TR-HOT", machine = "MIX01", threshold = 85 }
loose = []
fills = { name = "Mixer running hot", tag = "temp", condition = "above", action = "raise_corrective_maintenance" }
requires = ["machine:MIX01", "no trigger:TR-HOT"]

[[case]]
id = "supervisor-proposes-a-setpoint-change"
request = "recommend mix speed 42 on MIX01 - brix has been drifting high all shift"
screen = "/dashboard/adjustments"
expect = "propose"
tool = "propose_adjustment"
args = { machine = "MIX01", value = 42 }
loose = []
fills = { tag = "mix_speed", rationale = "brix has been drifting high all shift", evidence = { readings = 12, note = "brix has been above 11.0 all shift" } }
requires = ["machine:MIX01"]

# --------------------------------------------------------------- look first

[[case]]
id = "supervisor-asks-who-changed-the-reporting-window"
request = "who changed the default reporting window, and when?"
screen = "/dashboard/config/engineering"
expect = "read"
reads = ["setting_changes"]
contains = ["default_report_hours", "ADMIN"]
never = ["no change is recorded"]
lookup = { key = "default_report_hours" }
requires = ["setting:engineering/default_report_hours"]

[[case]]
id = "supervisor-says-the-nonconformance-is-already-closed"
request = "I closed NC-00001 this morning, has it gone?"
screen = "/dashboard/quality"
expect = "read"
reads = ["nonconformance"]
contains = ["NC-00001", "open"]
note = "it is still open. The honest answer needs the record, not the person's memory of it."
lookup = { code = "NC-00001" }
requires = ["nonconformance:NC-00001"]

[[case]]
id = "supervisor-says-they-booked-and-asks-if-it-landed"
request = "I booked 400 on the mixer an hour ago, is it on the order?"
screen = "/dashboard/orders"
expect = "read"
reads_any = ["order_detail", "orders"]
contains = ["WO-EVAL-1"]
lookup = { code = "WO-EVAL-1" }
requires = ["order:WO-EVAL-1"]

[[case]]
id = "supervisor-asks-why-the-line-stopped"
request = "why did the line stop?"
screen = "/dashboard"
expect = "answer"
reads_any = ["downtime", "machine_alarms", "machines"]

[[case]]
id = "supervisor-asks-what-is-open-in-quality"
request = "what non-conformances are open right now?"
screen = "/dashboard/quality"
expect = "answer"
reads_any = ["quality", "nonconformance"]
contains = ["NC-00001"]
requires = ["nonconformance:NC-00001"]

# ------------------------------------------------------------------- show me

[[case]]
id = "supervisor-asks-how-to-close-a-nonconformance"
request = "how do I close a non-conformance?"
screen = "/dashboard/quality"
expect = "walk"
guide = "close-nc"

[[case]]
id = "supervisor-asks-to-be-shown-order-actions"
request = "show me where I release or close an order"
screen = "/dashboard/orders"
expect = "walk"
guide = "act-on-order"

[[case]]
id = "supervisor-asks-how-to-find-the-work-instruction"
request = "how do I find the work instruction for this job?"
screen = "/dashboard/quality"
expect = "walk"
guide = "find-instruction"

# ------------------------------------------------------------------- not yours

[[case]]
id = "supervisor-refused-creating-an-account"
request = "create an account for Jo Patel as an operator"
screen = "/dashboard/admin"
expect = "refuse"
tool = "create_user"
mentions = ["users.manage", "can"]
note = "correctly not offered, and the sentence says who could - only Administrator does"

[[case]]
id = "supervisor-refused-approving-their-own-draft"
request = "approve the draft instruction WI-EVAL-1 and put it in force"
screen = "/dashboard/instructions"
expect = "refuse"
guide = "approve-a-document"
mentions = ["documents.approve", "never approves"]
requires = ["instruction:WI-EVAL-1"]
note = """A supervisor may draft and may not approve, so this is never a
proposal - but it is not a dead end either. The case asked for a walk to the
signing control *or* the honest sentence that this signature is not theirs;
`assist-show-me-surfaces` chose the sentence, on 2026-09-26. The walk exists
and is listed to them - that is what lets the assistant name the capability
instead of saying "no tool named approve" - and asking for it is refused with
the capability, its plain description, and the fact that the assistant signs
nothing. Walking them to a button their role is not shown would be worse."""

[[case]]
id = "supervisor-revises-an-instruction"
request = "revise WI-EVAL-1: change the title to Brix check at the mixer"
screen = "/dashboard/instructions"
expect = "propose"
tool = "revise_document"
args = { code = "WI-EVAL-1", title = "Brix check at the mixer" }
anchor = "instruction-actions"
requires = ["instruction:WI-EVAL-1"]
note = """`WI-EVAL-1` rather than the WI-BRIX a sibling case drafts: revising one
needs it to be there, drafting one needs it not to be, and a run cannot arrange
both of the same code. The instruction a run puts up carries the prefix so that
what a faithfulness run left on a plant can be told from the plant's own work."""

# ------------------------------------ the dispositions that were offered to anybody
#
# Four of the seven write tools the catalogue offered to an operator until
# 2026-09-27, all of them gated at the route on quality.close_nc, plus the ERP
# retry gated on orders.close. An operator asking for any of these got a card
# with "Do it" on it and then a refusal from the route. They are a supervisor's,
# and these are the cases that say so.

[[case]]
id = "supervisor-issues-a-certificate-of-analysis"
request = "issue the certificate of analysis for WO-EVAL-1"
screen = "/dashboard/coa"
expect = "propose"
tool = "issue_certificate"
args = { order = "WO-EVAL-1" }
requires = ["order:WO-EVAL-1"]
note = """The fixture order is released, not finished, and the plant may well
refuse to certify it. That is the plant's answer to give: what is scored here is
that the assistant proposes the issue rather than telling a supervisor there is
no tool for it, which is what it did before this tool named its capability."""

[[case]]
id = "supervisor-issues-a-pallets-certificate"
request = "issue the certificate for pallet SN-EVAL-CASE-1"
screen = "/dashboard/coa"
expect = "propose"
tool = "issue_pallet_certificate"
args = { pallet = "SN-EVAL-CASE-1" }
requires = ["unit:SN-EVAL-CASE-1"]
note = """A separate tool from the one above, and a separate route: `/coa/{order}`
and `/coa/pallet/{serial}` are two paths of different lengths, and a reader that
treated one as covering the other is the bug
`test_a_tool_never_counts_as_covering_a_longer_path` was written for."""

[[case]]
id = "supervisor-quarantines-a-pallet-and-what-is-inside-it"
request = "quarantine SN-EVAL-CASE-1 and everything in it, the brix on that run was out"
screen = "/dashboard/trace"
expect = "propose"
tool = "set_unit_status"
args = { serial = "SN-EVAL-CASE-1", status = "quarantined", cascade = true }
fills = { note = "brix on that run was out of specification" }
requires = ["unit:SN-EVAL-CASE-1"]
note = """Cascade is the whole point: holding a pallet without holding its cases
holds nothing. The tool defaults it to true and the sentence says it out loud, so
it is scored."""
