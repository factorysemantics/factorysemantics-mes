# The administrator's file, and Scott's own two conversations.
#
# Every request marked with a `source` line is quoted exactly as he typed it,
# including the typing. "set it to4" is not a typo in this file.

role = "admin"

# ---------------------------------------- Scott, 2026-09-26 morning (bottling)

[[case]]
id = "scott-wants-the-reporting-window-at-ten"
request = "I want to change the default reporting window to 10hrs"
screen = "/dashboard"
expect = "propose"
tool = "write_plant_setting"
args = { domain = "engineering", key = "default_report_hours", value = "10" }
anchor = "setting-in-focus"
source = "questions/2026-09-26.md, ~05:11 CDT, bottling, ADMIN"
note = """Answered: "none of them hold a 'default reporting window' setting". It
is item 17 of 22 in a list the tool result had cut at 6,000 characters. Fixed in
#108; this case is what stops it coming back."""

[[case]]
id = "scott-says-he-changed-it-and-asks-for-it-back"
request = "I just changed it to 10.0 hrs. Could you change it back to 8 hrs?"
screen = "/dashboard"
expect = "read"
reads = ["setting_changes"]
contains = ["default_report_hours", "10.0"]
never = ["I don't see any change recorded", "no change recorded"]
source = "questions/2026-09-26.md, ~05:13 CDT, bottling, ADMIN"
note = """Answered "I don't see any change recorded" without making a single tool
call. He had changed it. The read has to happen before the sentence does."""
lookup = { key = "default_report_hours" }

# ------------------------------- Scott, 2026-09-25 evening (default_job_minutes)

[[case]]
id = "scott-changes-how-long-an-unplanned-job-takes"
request = "Change default_job_minutes to 56"
screen = "/dashboard/config/engineering"
expect = "propose"
tool = "write_plant_setting"
args = { domain = "engineering", key = "default_job_minutes", value = "56" }
anchor = "setting-in-focus"
source = "journal/2026-09-25.md 20:28 and 2026-09-25 late — the steward's reproduction"
note = """His own wording that evening was not written down; this is the sentence
the reproduction used. What he reported was the walk stopping at the top of the
Configuration page - the `setting-in-focus` step, fixed in #105. The anchor is
what this case is here to pin."""

# ------------------------------- Scott, 2026-09-26 afternoon (bottling, ADMIN)

[[case]]
id = "scott-wants-the-nonconformance-prefix-to-be-cr"
request = "I want a non-conformance to have a prefix CR instead of NC. Could you make that change?"
screen = "/dashboard"
expect = "propose"
tool = "write_plant_setting"
args = { domain = "quality", key = "nc_code_prefix", value = "CR" }
anchor = "setting-in-focus"
source = "questions/2026-09-26.md, ~14:57 CDT"
note = "this one it got right, and then lost three times over"

[[case]]
id = "scott-asks-to-be-shown-where"
request = "could you show me where?"
screen = "/dashboard"
expect = "walk"
guide = "proposal"
anchor = "setting-in-focus"
not_guide = ["find-instruction", "record-check"]
before_request = "I want a non-conformance to have a prefix CR instead of NC. Could you make that change?"
source = "questions/2026-09-26.md, ~14:58 CDT, with the nc_code_prefix proposal open"
expected = "not_yet"
handoff = "assist-one-brain"
note = """He was answered with "find the work instruction for a job", then with
"record a quality inspection", then with "record a quality inspection" again.
The proposal on his screen had a two-step walk onto the very field. Two
mechanisms: a regex decides a "show me" before the model is asked, and a message
typed over an open proposal leaves the conversation in a state the hosted API
refuses from then on."""

[[case.before]]
propose = "write_plant_setting"
args = { domain = "quality", key = "nc_code_prefix", value = "CR" }
say = "There is a setting for this: nc_code_prefix in Quality, currently \"NC\". I can change it to \"CR\" - nothing changes until you confirm."

[[case]]
id = "scott-types-a-value-over-an-open-proposal"
request = "set it to4"
screen = "/dashboard"
expect = "answer"
never = ["did not answer", "no longer open"]
before_request = "I want a non-conformance to have a prefix CR instead of NC. Could you make that change?"
source = "questions/2026-09-26.md, ~15:00 CDT, with a proposal open"
expected = "not_yet"
handoff = "assist-one-brain"
note = """A fresh proposal, or a question about what he meant. What he got was
"The cloud brain did not answer (BadRequestError). That proposal is no longer
open." - and every turn after it went to a brain with no tools."""

[[case.before]]
propose = "write_plant_setting"
args = { domain = "quality", key = "nc_code_prefix", value = "CR" }
say = "There is a setting for this: nc_code_prefix in Quality, currently \"NC\". I can change it to \"CR\" - nothing changes until you confirm."

[[case]]
id = "scott-asks-which-spc-rules-are-on-hold"
request = "which spc rules are on hold"
screen = "/dashboard/config/quality"
expect = "read"
reads = ["plant_settings"]
contains = ["hold_rules", "1,2,3,4"]
never = ["quality procedure", "contact the quality manager"]
source = "questions/2026-09-26.md, ~15:02 CDT"
note = "answered \"The cloud brain did not answer (BadRequestError)\""
lookup = { domain = "quality", find = "hold" }

[[case]]
id = "scott-changes-which-spc-rules-raise-a-hold"
request = "I want to change the quality configuration for which spc rules raise a hold to 1,2 only"
screen = "/dashboard/config/quality"
expect = "propose"
tool = "write_plant_setting"
args = { domain = "quality", key = "hold_rules", value = "1,2" }
anchor = "setting-in-focus"
source = "questions/2026-09-26.md, ~15:04 CDT"
note = """Answered with a paragraph about updating "the quality configuration
document" and the "quality.define task". There is a setting, a tool and a walk;
none of the three was reached."""

[[case]]
id = "scott-describes-a-setting-by-its-label"
request = "configurate this When a gauge can judge a tolerance to fail"
screen = "/dashboard/config/quality"
expect = "read"
reads = ["plant_settings"]
contains = ["gauge_ratio"]
never = ["does not have a specific configuration", "consult the approved work instruction"]
source = "questions/2026-09-26.md, ~15:03 CDT"
note = """He pasted the label off the screen. "When a gauge can judge a
tolerance" is the section's own label and `plant_settings` searches labels, so
this is one read away. He was told the system has no such configuration."""
lookup = { domain = "quality", find = "gauge" }

[[case]]
id = "scott-asks-to-be-taken-to-scrap"
request = "take me to scrap"
screen = "/dashboard"
expect = "answer"
reads_any = ["orders", "order_detail", "quality", "line_wip"]
never = ["quality procedure", "work instructions for details", "consult"]
source = "questions/2026-09-26.md, ~15:01 CDT"
note = "an honest \"I have no tool that lists scrap by itself\" is a pass; a pointer at a procedure document is not"

[[case]]
id = "scott-asks-for-the-worst-scrap-records"
request = "worst scrap records"
screen = "/dashboard"
expect = "answer"
reads_any = ["orders", "order_detail", "quality", "spc_chart"]
never = ["The facts do not contain the answer", "recent_orders"]
source = "questions/2026-09-26.md, ~15:01 CDT"

[[case]]
id = "scott-asks-for-last-weeks-orders"
request = "orders from last week"
screen = "/dashboard/orders"
expect = "answer"
reads_any = ["orders", "schedule_board"]
never = ["orders archive", "historical data section"]
source = "questions/2026-09-26.md, ~15:02 CDT"
note = "there is no archive and no historical data section. Sending somebody to one is worse than saying the tool only lists open orders."

# ------------------------------------------ the administrator's own write tools

[[case]]
id = "admin-creates-an-account"
request = "create an account JO for Jo Patel as an operator"
screen = "/dashboard/admin"
expect = "propose"
tool = "create_user"
args = { code = "JO", role = "operator" }
loose = []
fills = { name = "Jo Patel", password = "a-long-enough-password" }

[[case]]
id = "admin-defines-a-role"
request = "define a role line_lead called Line Lead that can see the plant and book production"
screen = "/dashboard/admin"
expect = "propose"
tool = "create_role"
args = { code = "line_lead" }
fills = { name = "Line Lead", capabilities = ["plant.read", "production.book"] }

[[case]]
id = "admin-redefines-a-role"
request = "redefine the operator role: plant.read and production.book only"
screen = "/dashboard/admin"
expect = "propose"
tool = "update_role"
args = { code = "operator" }
fills = { name = "Operator", capabilities = ["plant.read", "production.book"] }

[[case]]
id = "admin-assigns-a-role"
request = "make SCOTT a supervisor"
screen = "/dashboard/admin"
expect = "propose"
tool = "assign_role"
args = { user = "SCOTT", role = "supervisor" }

[[case]]
id = "admin-adds-a-material"
request = "add a raw material RAW-CARAMEL, caramel colour, in kg"
screen = "/dashboard/admin"
expect = "propose"
tool = "create_material"
args = { code = "RAW-CARAMEL", type = "raw", unit = "kg" }
fills = { name = "Caramel colour" }

[[case]]
id = "admin-adds-equipment"
request = "add a work unit FILL01 called Filler 01 under LINE1"
screen = "/dashboard/admin"
expect = "propose"
tool = "create_equipment"
args = { code = "FILL01", level = "work_unit", parent = "LINE1" }
fills = { name = "Filler 01" }

[[case]]
id = "admin-defines-a-routing"
request = "create a routing RT-DIET for FG-COLA: operation 10 Mix on MIX01"
screen = "/dashboard/admin"
expect = "propose"
tool = "create_routing"
args = { code = "RT-DIET", material = "FG-COLA" }
fills = { name = "Make Diet Cola", operations = [{ seq = 10, name = "Mix", equipment = "MIX01" }] }

[[case]]
id = "admin-defines-a-specification"
request = "set the fill weight specification on FG-COLA to 494 to 506 g"
screen = "/dashboard/quality"
expect = "propose"
tool = "create_spec"
args = { material = "FG-COLA", characteristic = "fill_weight", min_value = 494, max_value = 506 }
loose = ["characteristic"]
loose_about = "the sentence says 'fill weight'; whatever this plant calls that characteristic is a fair reading"

[[case]]
id = "admin-adds-a-bom-line"
request = "FG-COLA needs 0.12 kg of RAW-SUGAR per unit - add it to the bill of material"
screen = "/dashboard/admin"
expect = "propose"
tool = "add_bom_component"
args = { material = "FG-COLA", component = "RAW-SUGAR", quantity = 0.12 }

[[case]]
id = "admin-defines-a-maintenance-plan"
request = "set up a plan PM-MIX01-BELT on MIX01, a belt check every 30 days, 45 minutes"
screen = "/dashboard/maintenance"
expect = "propose"
tool = "create_maintenance_plan"
args = { code = "PM-MIX01-BELT", machine = "MIX01", interval = 30 }
fills = { name = "Mixer belt check", trigger = "calendar", expected_minutes = 45 }

[[case]]
id = "admin-schedules-one-order"
request = "schedule WO-EVAL-1"
screen = "/dashboard/schedule"
expect = "propose"
tool = "plan_order"
args = { order = "WO-EVAL-1" }

[[case]]
id = "admin-schedules-everything-open"
request = "plan every open order"
screen = "/dashboard/schedule"
expect = "propose"
tool = "plan_all_orders"
args = {}

[[case]]
id = "admin-adds-a-shift"
request = "add a DAY shift, 06:00 to 14:00, Monday to Friday"
screen = "/dashboard/schedule"
expect = "propose"
tool = "add_shift"
args = { code = "DAY", starts = "06:00", ends = "14:00" }
fills = { name = "Day", days = "1,2,3,4,5" }

[[case]]
id = "admin-adds-a-calendar-exception"
request = "25 December 2026 is a holiday - Christmas Day"
screen = "/dashboard/schedule"
expect = "propose"
tool = "add_calendar_exception"
args = { day = "2026-12-25", kind = "holiday" }
fills = { reason = "Christmas Day" }

[[case]]
id = "admin-drafts-a-downtime-reason"
request = "draft a downtime reason changeover, called Changeover, for a planned product change"
screen = "/dashboard/reasons"
expect = "propose"
tool = "draft_downtime_reason"
args = { code = "changeover" }
anchor = "reason-code"
fills = { name = "Changeover", description = "A planned product change" }

[[case]]
id = "admin-drafts-a-severity"
request = "draft a cosmetic severity: visible, not functional"
screen = "/dashboard/severities"
expect = "propose"
tool = "draft_nc_severity"
args = { code = "cosmetic" }
anchor = "severity-code"
fills = { name = "Cosmetic", description = "Visible, not functional" }

[[case]]
id = "admin-sets-the-cpk-bar"
request = "set the Cpk bar for capable to 1.33"
screen = "/dashboard/config/quality"
expect = "propose"
tool = "write_plant_setting"
args = { domain = "quality", key = "cpk_capable", value = "1.33" }
anchor = "setting-in-focus"

# ------------------------------------------------ look before you say anything

[[case]]
id = "admin-says-they-set-the-cpk-bar-this-morning"
request = "I set the Cpk bar to 1.5 this morning - is that what it says now?"
screen = "/dashboard/config/quality"
expect = "read"
reads_any = ["plant_settings", "setting_changes"]
contains = ["cpk_capable"]
never = ["no change is recorded"]
note = "they did not. The read says 1.33 is the default and nobody has changed it, which is the answer."
lookup = { domain = "quality", find = "cpk" }

[[case]]
id = "admin-asks-who-touched-the-settings"
request = "has anybody changed a setting on this plant today?"
screen = "/dashboard/config/engineering"
expect = "read"
reads = ["setting_changes"]
contains = ["default_report_hours"]

[[case]]
id = "admin-says-they-released-the-order"
request = "I released WO-EVAL-1 - is it on the floor?"
screen = "/dashboard/orders"
expect = "read"
reads_any = ["order_detail", "orders"]
contains = ["released"]
lookup = { code = "WO-EVAL-1" }

# ------------------------------------------------------------------- show me

[[case]]
id = "admin-asks-how-to-add-somebody"
request = "how do I add someone and give them a role?"
screen = "/dashboard/admin"
expect = "walk"
