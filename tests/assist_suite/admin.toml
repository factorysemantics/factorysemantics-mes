# The administrator's file, and Scott's own two conversations.
#
# Every request marked with a `source` line is quoted exactly as he typed it,
# including the typing. "set it to4" is not a typo in this file.

role = "admin"

# ---------------------------------------- Scott, 2026-09-26 morning (bottling)

[[case]]
id = "scott-wants-the-reporting-window-at-ten"
request = "I want to change the default reporting window to 10hrs"
screen = "/dashboard"
expect = "propose"
tool = "write_plant_setting"
args = { domain = "engineering", key = "default_report_hours", value = "10" }
anchor = "setting-in-focus"
source = "questions/2026-09-26.md, ~05:11 CDT, bottling, ADMIN"
requires = ["setting:engineering/default_report_hours"]
note = """Answered: "none of them hold a 'default reporting window' setting". It
is item 17 of 22 in a list the tool result had cut at 6,000 characters. Fixed in
#108; this case is what stops it coming back."""

[[case]]
id = "scott-says-he-changed-it-and-asks-for-it-back"
request = "I just changed it to 10.0 hrs. Could you change it back to 8 hrs?"
screen = "/dashboard"
expect = "read"
reads = ["setting_changes"]
contains = ["10.0"]
contains_any = [["default_report_hours", "default reporting window", "reporting window"]]
never = ["I don't see any change recorded", "no change recorded"]
requires = ["setting:engineering/default_report_hours"]
source = "questions/2026-09-26.md, ~05:13 CDT, bottling, ADMIN"
note = """Answered "I don't see any change recorded" without making a single tool
call. He had changed it. The read has to happen before the sentence does.

The key was a `contains` literal until 2026-09-28, and live on `09c8ce2c` that
cost the case: the model read both records and said *"the default reporting
window is already back at 8.0 hours - the audit trail shows it was changed from
10.0 to 8.0 at 16:14 today"*, which is the right answer, read from the trail, in
the words off the screen. The label is now a rendering of its own. The value
stays a `contains` literal: the trail records `10.0`, and a reply that cannot
say which number was there has not read it."""
lookup = { key = "default_report_hours" }

