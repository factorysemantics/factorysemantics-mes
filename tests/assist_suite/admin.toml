tool = "write_plant_setting"
args = { domain = "quality", key = "cpk_capable", value = "1.67" }
anchor = "setting-in-focus"
note = """1.67 rather than the 1.33 this asked for until 2026-09-27, which is the
product's own default: live, the model answered *"it is already 1.33 - no change
is needed"*, which is right, and the case was scoring it as a failure. A case
that asks for a change has to name a value that is one. 1.67 is the other bar
plants set, and it is above `cpk_marginal`, which the checker requires."""

# ------------------------------------------------ look before you say anything

[[case]]
id = "admin-says-they-set-the-cpk-bar-this-morning"
request = "I set the Cpk bar to 1.5 this morning - is that what it says now?"
screen = "/dashboard/config/quality"
expect = "read"
reads_any = ["plant_settings", "setting_changes"]
contains_any = [
  ["cpk_capable", "cpk capable", "Cpk bar", "capable Cpk"],
]
never = ["no change is recorded"]
requires = ["setting:engineering/default_report_hours"]
note = """they did not. The read says 1.33 is the default and nobody has changed
it, which is the answer.

Loosened on 2026-09-27: the live model read `setting_changes` and
`plant_settings` and answered truly - *"it reads 1.33 ... there is no audit
record of any write"* - and the case failed it for writing "the Cpk capable
bar" rather than the literal `cpk_capable`. A person at a machine reads the
label, not the key, and #115's `contains_any` exists for exactly this. What is
still scored is that it looked before it answered."""
lookup = { domain = "quality", find = "cpk" }

[[case]]
