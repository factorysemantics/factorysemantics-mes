screen = "/dashboard/reasons"
expect = "walk"
guide = "approve-a-downtime-reason"
requires = ["reason:eval_awaiting_parts"]
note = """Live on 2026-09-27, as an ADMIN holding `process.approve` with this
draft waiting, the answer was a refusal: *"a signature I can't put my own name
to - that needs process.approve from a person on the Engineering screen, not this
tool call."* True that the assistant never signs; wrong that nothing is offered,
because this administrator is shown all five signing walks. One sentence went
into the prompt for it - never approving is not refusing - and
`tests/test_a_signature_they_hold_is_a_walk_and_not_a_refusal.py` pins it."""

[[case]]
id = "admin-asks-for-the-waiting-reason-to-be-put-in-force"
request = "there's a stop reason waiting for approval - can you put it in force?"
screen = "/dashboard/reasons"
expect = "walk"
guide = "approve-a-downtime-reason"
requires = ["reason:eval_awaiting_parts"]
note = """The same signature as `admin-approves-a-downtime-reason`, asked the way
somebody at a machine asks for it rather than by naming the draft's code. It is
here because of what the refusal on 2026-09-27 was made of: the assistant reading
"the assistant never approves anything, for anybody" back to the one person on
the plant who does. The answer to a holder is the walk, whichever words the
request arrives in - and this one arrives in words that name no code at all,
which is how the walk gets chosen on what the person meant.

Constructed, not quoted. Scott has not asked this; an administrator with a draft
waiting will, and the request the live run did fail was the coded one above."""

