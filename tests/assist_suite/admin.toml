[[case]]
id = "admin-adds-a-calendar-exception"
request = "25 December 2026 is a holiday - Christmas Day"
screen = "/dashboard/schedule"
expect = "propose"
tool = "add_calendar_exception"
args = { day = "2026-12-25", kind = "non_working" }
fills = { reason = "Christmas Day" }
note = """`holiday` was never a kind this API accepts, and neither was the
`shutdown` the live model sent on 2026-09-26. There are two: `non_working` (a
holiday or a shutdown - the plant is dark) and `working` (an overtime day that
is normally dark). Neither the docstring nor this case said so, so the case was
scoring the model against a word the plant would have refused. The tool's
docstring names both kinds now, and
`tests/test_the_calendar_tool_names_every_kind_its_api_accepts.py` fails if a
third is ever added to the enum and not to the sentence."""

[[case]]
id = "admin-drafts-a-downtime-reason"
request = "draft a downtime reason changeover, called Changeover, for a planned product change"
screen = "/dashboard/reasons"
expect = "propose"
tool = "draft_downtime_reason"
args = { code = "changeover" }
anchor = "reason-code"
fills = { name = "Changeover", description = "A planned product change" }
requires = ["no reason:changeover"]
note = """Drafting needs the code *not* to be there. Most real plants already
have a `changeover`, and on 2026-09-26 the live model said so - "it is already
at revision 1, approved and in force" - which is right, and was scored as a
failure. On such a plant this case is now reported not arranged. The draft a run
puts up for the approval cases is `eval_awaiting_parts` - a different word, not
the same word with a prefix on it, which is what `eval_changeover` was until
2026-09-27 and which reads to a model as the thing this case asks for."""

[[case]]
id = "admin-drafts-a-severity"
request = "draft a cosmetic severity: visible, not functional"
screen = "/dashboard/severities"
expect = "propose"
tool = "draft_nc_severity"
args = { code = "cosmetic" }
anchor = "severity-code"
fills = { name = "Cosmetic", description = "Visible, not functional" }
requires = ["no severity:cosmetic"]
note = """His words stayed and the fixture moved. Live on 2026-09-27 this was
answered *"there's already a draft 'cosmetic' severity (code eval_cosmetic)"* -
the draft a run had just put up. The prefix kept the codes apart for the ratchet;
it did not keep the words apart for the model. The draft a run puts up is
`eval_scuff` now, and a test walks every arranged draft against every drafting
case so this cannot come back."""

[[case]]
id = "admin-sets-the-cpk-bar"
