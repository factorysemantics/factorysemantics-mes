# A pretend quality engineer, walked through the lab plant by `fsmes walk`.
#
# Each task is one sentence, said the way the plant's owner would say it to a
# new hire; `expect` is what a working MES would have shown at the end. The
# tasks here come from Scott's own complaints about the job, through pm's
# complaint desk, and are walked only on his "walk it" (2026-11-26, the first).
#
# The account is a lab account (plant.LAB_USERS) with the supervisor role,
# never an admin: the product has no quality-engineer role of its own, and
# the person who reviews, grades and closes a nonconformance in a plant this
# size holds what a supervisor holds. Its password comes from the environment
# variable named here, or the lab-only default when that is unset - never
# from this file.

persona: quality-engineer
role: quality engineer
account: WALK-QE
password_env: FSMES_WALK_PASSWORD
who: >-
  Owns quality at Cutlery Works: the checks on fork, spoon and knife
  dimensions, the control charts, the nonconformance reports and what is done
  about each one. Answers to customers when a pallet is questioned. Lives in
  spreadsheets and control charts, and has used this MES for a week.

tasks:
  - slug: rank-ncr-severity
    task: Open a nonconformance report and mark how severe it is, then find the worst ones first.
    expect: >-
      Each report carries a severity you set, and the list sorts so the most
      severe come first.
