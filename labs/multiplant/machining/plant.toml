# The machining plant, as a pack.
#
# Written by `fsmes pack migrate` from this lab's old registry entry, then
# finished by hand. Unlike bottling, this plant's line is not the product's:
# its whole definition used to be `seed.py`, 156 lines of Python the registry
# named and `fsmes plant machining init` ran as a subprocess. Decision 0022
# says a pack carries no code, so the same plant is now the six files under
# masterdata/, and `fsmes pack apply` seeds from them.

[pack]
format = 1
requires = ">=0.1.2"

[plant]
name       = "machining"
label      = "Northgate Machining / Cell A — 3-station machining cell"
timezone   = "America/New_York"
profile    = "laptop"
enterprise = "NORTHGATE"
site       = "NG1"

[serve]
api_host     = "127.0.0.1"
api_port     = 8020
opc_endpoint = "opc.tcp://127.0.0.1:4842/fsmes/machining"
simulate     = true

[files]
tag_map    = "tag_map.json"
replay_dir = "out"
masterdata = "masterdata"

[oee]
# This plant will not report a KPI for a window it watched less than 80% of.
# It comes back as unknown with the coverage ledger attached instead, and the
# screen prints the ledger rather than drawing a smaller bar.
#
# There is no default floor in the product: a plant that leaves this key out
# gets every figure with its coverage printed beside it and nothing withheld.
# The three lab packs set one so the behaviour is visible in the fleet — an
# agent that goes away for an hour of a shift should be the reason a number
# disappears, not a reason it quietly goes down.
coverage_floor = 0.8

[erp]
mode = "off"
