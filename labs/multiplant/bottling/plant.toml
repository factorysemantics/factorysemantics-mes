# The bottling plant, as a pack.
#
# Written by `fsmes pack migrate` from this lab's old registry entry, then
# finished by hand: a registry never held a time zone, a profile, a module
# list or a word, and `fsmes pack migrate` will not invent one.
#
# This plant's line is the product's own reference line - the same six
# stations `fsmes seed-kepsim` builds - and until 2026-09-14 the pack carried
# no master data at all, on the argument that a line shipping with the product
# should not be copied into a pack. What that actually produced was a plant
# that came up empty from every command that builds one: `fsmes fleet create`
# and `fsmes plant bottling init` left it with no machines, `fsmes score
# bottling` and `fsmes sweep bottling` died on their first read with *no line
# has any machines on it yet*, and the one thing that did seed it was a
# `init.py` the registry had stopped naming.
#
# So the line is in masterdata/ now, generated once from `seed_kepsim` itself.
# One plant, one way to build it. See masterdata/README.md.

[pack]
format = 1
requires = ">=0.1.2"

[plant]
name       = "bottling"
label      = "ACME Beverages / Kansas City — 6-station bottling line"
timezone   = "America/Chicago"
profile    = "laptop"
enterprise = "ACME"
site       = "KC1"

[serve]
# The interface to serve on; a LAN or tailnet address to share it.
api_host     = "127.0.0.1"
api_port     = 8010
opc_endpoint = "opc.tcp://127.0.0.1:4841/fsmes/bottling"
simulate     = true

[files]
tag_map    = "tag_map.json"
# This plant's own line data, generated from `line.json` beside it:
#
#     fsmes sim-generate labs/multiplant/bottling/line.json
#
# It used to be `../../kepsim/out` - the reference hour. A CSV replay wraps
# at the end of the file, so an hour of line data put the same changeover at
# :18 of every hour and the same stops at the same second for as long as the
# plant was up, and every chart longer than an hour was a stencil. `line.json`
# here is that same six-station line played as an eight-hour shift, with each
# planted story happening once; the hour next door is untouched, because it is
# what CI replays and what the scorer is measured against.
#
# `line.json` sits beside `out/` on purpose and not by taste: the product
# finds a plant's ground truth as `line.json` in the replay directory's parent
# (`fsmes score`, `fsmes sweep`, `fsmes lab`), so this is also what keeps this
# plant scoreable. `out/` is generated and never committed.
replay_dir = "out"
masterdata = "masterdata"
# What this plant's simulated floor does that no PLC reports: which scale
# takes a fill-weight reading, which one is drifting between calibrations,
# which of the six approved words a stop is named with, and what happens to
# the material behind a finding. Read only by `fsmes run-operations`; a real
# plant leaves this out and has people instead.
floor      = "floor.json"

[oee]
# This plant will not report a KPI for a window it watched less than 80% of.
# It comes back as unknown with the coverage ledger attached instead, and the
# screen prints the ledger rather than drawing a smaller bar.
#
# There is no default floor in the product: a plant that leaves this key out
# gets every figure with its coverage printed beside it and nothing withheld.
# The three lab packs set one so the behaviour is visible in the fleet — an
# agent that goes away for an hour of a shift should be the reason a number
# disappears, not a reason it quietly goes down.
coverage_floor = 0.8

[erp]
# No ERP in the lab: every plant would otherwise poll the same mock ERP and
# fight over the same orders, which would look like an MES bug. This used to
# be hard-coded in `plant_env` for every registry plant, which meant no
# registry plant could reach an ERP at all - finding 1 of the M8 design.
mode = "off"

[quality]
# `fill_height` on this line is inspected five bottles at a time, so its chart
# is X-bar and R and its second half is the chart of sample ranges. Rule 5 - a
# range beyond its upper limit - is drawn and recorded on every plant whatever
# this list says (decision 0036); this plant names it, because a sample whose
# five bottles disagree that widely has widened the X-bar limits beside it,
# and reading the means without reading that is reading a broken chart.
#
# It is on `major_rules` for the same reason it is on `hold_rules`: the
# finding is the same kind rule 1 is, a point outside a limit, and this plant
# calls that major. Rule 5 is a *range* on either chart, so naming it here
# also means the moving range on this plant's one-at-a-time characteristics
# raises a hold - which is what a line that measures fill weight every bottle
# wants, and is the whole reason the number is one rule and not two.
hold_rules  = [1, 2, 3, 4, 5]
major_rules = [1, 5]
