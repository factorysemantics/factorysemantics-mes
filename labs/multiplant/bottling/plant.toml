# The bottling plant, as a pack.
#
# Written by `fsmes pack migrate` from this lab's old registry entry, then
# finished by hand: a registry never held a time zone, a profile, a module
# list or a word, and `fsmes pack migrate` will not invent one.
#
# This plant's line is the product's own reference line - the same six
# stations `fsmes seed-kepsim` builds - and until 2026-09-14 the pack carried
# no master data at all, on the argument that a line shipping with the product
# should not be copied into a pack. What that actually produced was a plant
# that came up empty from every command that builds one: `fsmes fleet create`
# and `fsmes plant bottling init` left it with no machines, `fsmes score
# bottling` and `fsmes sweep bottling` died on their first read with *no line
# has any machines on it yet*, and the one thing that did seed it was a
# `init.py` the registry had stopped naming.
#
# So the line is in masterdata/ now, generated once from `seed_kepsim` itself.
# One plant, one way to build it. See masterdata/README.md.

[pack]
format = 1
requires = ">=0.1.2"

[plant]
name       = "bottling"
label      = "ACME Beverages / Kansas City — 6-station bottling line"
timezone   = "America/Chicago"
profile    = "laptop"
enterprise = "ACME"
site       = "KC1"

[serve]
# The interface to serve on; a LAN or tailnet address to share it.
api_host     = "127.0.0.1"
api_port     = 8010
opc_endpoint = "opc.tcp://127.0.0.1:4841/fsmes/bottling"
simulate     = true

[files]
tag_map    = "tag_map.json"
replay_dir = "../../kepsim/out"
masterdata = "masterdata"

[erp]
# No ERP in the lab: every plant would otherwise poll the same mock ERP and
# fight over the same orders, which would look like an MES bug. This used to
# be hard-coded in `plant_env` for every registry plant, which meant no
# registry plant could reach an ERP at all - finding 1 of the M8 design.
mode = "off"
