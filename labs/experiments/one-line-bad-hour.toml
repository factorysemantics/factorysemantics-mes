# One line, one bad hour.
#
# The six-station bottling line playing the script it was written with: a jam
# too short to ripple, a motor that heats for ten minutes and then fails, a
# quality excursion at the washer that underweights every bottle downstream, a
# planned changeover, a counter that snaps to zero mid-shift, and micro-stops
# on the palletiser all the way through. Six things a real plant does in an
# hour, and six chances for an MES to say something untrue about them.
#
#     fsmes lab run labs/experiments/one-line-bad-hour.toml
#
# About four minutes: one plant, an hour of line time replayed at 20x, plus the
# seeding and the drain. Nothing you already have running is touched - the
# plant this builds is ephemeral, on loopback, with its own database and its
# own ports.

name = "one-line-bad-hour"
note = """One line playing the six classic faults. What to look at first: the
changeover must not appear as downtime, and the counter reset must book
nothing."""

packs = ["../multiplant/bottling"]

# The reference hour, with the hour's own script stated below rather than
# inherited from the pack - see the `[scenario.bottling]` note at the end for
# what changed on 2026-10-08 and why. Stating the seed is the point of stating
# it: the same seed twice is the same run, and the report says which seed it
# used.
duration = 3600
seed     = 42

# 20x replays the hour in three minutes. Slower is sharper: the booking
# comparison has to allow for whatever the replay played while the agent
# drained, and that band grows with speed. See docs/develop/experiments.md.
speed = 20

measure = ["booking", "downtime", "oee"]

# No `[init.bottling]` any more, and the reason is worth keeping. This pack
# carried no master data until 2026-09-14 - its line is the product's own
# reference line, the six stations `fsmes seed-kepsim` builds - so a plant
# built from the pack alone had no machines, and this plan named the lab
# script that seeded them. What that same gap did everywhere a plan was not
# involved: `fsmes fleet create` and `fsmes plant bottling init` built empty
# plants, and `fsmes score bottling` died on its first read. The line is in
# `../multiplant/bottling/masterdata/` now, so the pack alone is enough and a
# plan naming a script would be naming one that no longer exists.

[scenario.bottling]
# The reference hour's own script, stated here rather than inherited.
#
# Until 2026-10-08 this plan named no events, and a plan that names none plays
# the pack's - which was the reference hour, because the bottling pack's line
# *was* the reference hour. The pack's line is an eight-hour shift now: a plant
# whose data wraps every hour puts the same changeover at the same minute of
# every hour, and every chart longer than the file is a stencil. A plan asking
# for 3600 seconds of that shift is refused rather than half played, which is
# this builder's own rule working.
#
# So the hour is written where it is played. What each of these ten faults is
# for, and what an MES is expected to say about it, is in
# `labs/kepsim/line.json` and `labs/kepsim/scenario.md` - that file is where
# the hour is maintained, and
# `test_a_plan_that_plays_the_reference_hour_plays_the_hour_the_reference_line_scripts`
# fails if this list and that one drift apart.
events = [
  # the filler's supply pressure falls away for six minutes; every bottle in
  # the window is four grams light and nothing alarms
  { type = "offset", station = "Refill", analog = "NozzlePressure", offset = -0.26, start = 120, end = 480, effects = [ { station = "Refill", analog = "FillWeight", offset = -4.0 } ] },
  # a stop too short to ripple through buffers of 20
  { type = "down", station = "LD", start = 600, end = 612 },
  # the precursor: the motor heats for ten minutes before it fails
  { type = "drift", station = "RD", analog = "MotorTemp", to = 88.0, start = 900, end = 1500 },
  # and then it fails
  { type = "down", station = "RD", start = 1500, end = 1620 },
  # the washer story: scrap climbs while the wash runs three degrees hot, and
  # the filler underweights every bottle downstream with no alarm of its own
  { type = "scrap_burst", station = "Washer", scrap_pct = 10.0, analog_offset = 3.0, start = 1800, end = 2100, effects = [ { station = "Refill", analog = "FillWeight", offset = -9.0 } ] },
  # a PLANNED stop, whole line: booked as downtime, every availability figure
  # the MES reports is a lie
  { type = "changeover", start = 2400, end = 2640 },
  # the first bottles after the restart run heavy
  { type = "offset", station = "Refill", analog = "FillWeight", offset = 5.0, start = 2640, end = 2670 },
  # the counter snaps to zero mid-run, as a PLC does after a power blip
  { type = "counter_reset", station = "RD", at = 3000 },
  # the palletiser's micro-stops, all hour: the OEE-performance lesson
  { type = "micro_stops", station = "Palletiser", every_s = [110, 130], duration_s = [8, 18] },
  # a tag that goes quiet to the end of the hour while everything else reports
  { type = "quiet", station = "Refill", analog = "FillWeight", start = 2700, end = 3600 },
]
