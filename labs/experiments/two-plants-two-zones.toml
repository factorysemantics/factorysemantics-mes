# Two plants, two time zones, two different products, one command.
#
# Kansas City bottles at 110 a minute behind buffers of twenty; Northgate
# machines at 22 a minute behind buffers of six. They disagree about station
# count, station names, analog names and units, cycle rates, buffer sizes,
# order numbering and their clocks - America/Chicago and America/New_York. If
# any of that has leaked into code rather than staying in config, running the
# two side by side is where it shows.
#
# Northgate also runs with two modules off and two of the product's own words
# renamed, applied as an *overlay*: the copy of the pack this run builds from
# lands in the results directory, and the pack on disk is not touched.
#
#     fsmes lab run labs/experiments/two-plants-two-zones.toml
#
# About five minutes: two plants, fifty minutes of line time each at 30x, run
# one after another so neither competes with the other for the machine.
#
# It also asks what `fsmes fleet console` made of the pair. The plants run one
# after another - two replaying at speed on one laptop compete for the same
# cores - so at every moment of this run exactly one of them is answering and
# the other is not, which is the console's hardest case arriving for free. A
# console is started for the run, told each plant's address when that plant
# comes up, and asked at each phase: before either plant, while each is
# running, after each is torn down, and at the end when neither is there. A
# plant nobody can reach must read *unknown* - never healthy, and never down.
#
# Not yet here, and why: the third lab plant (`finewire`) is the one with a
# genuinely different zone *and* a PostgreSQL, and it wants that server and an
# operator password before it will start - which a CI runner has not got.

name = "two-plants-two-zones"
note = """Two plants that agree about nothing except the MES running them.
What to look at first: whether either plant's numbers read as if the other's
configuration had leaked into it."""

packs = ["../multiplant/bottling", "../multiplant/machining"]

# Fifty minutes, which is past Northgate's breakdown at 2700-2880 s and past
# the bottling line's counter reset at 3000 s. A shorter run would cut the
# scripts off, and this refuses to run a script it cannot finish rather than
# score half of one.
duration = 3000
seed     = 11
speed    = 30

measure = ["booking", "downtime", "oee", "console"]

# Northgate machines steel; nothing here carries a serial and no certificate of
# analysis is issued. Proven legal on the finewire pack already - `[words]`
# renames a label on a screen and `fsmes pack check` refuses it the moment it
# tries to rename a state, a KPI, a role or an event kind.
# Both packs carry their own master data, so neither needs an `[init]` table.
# Kansas City's did not until 2026-09-14 - its line is the product's own
# reference line - and the note in one-line-bad-hour.toml says what that cost.

[overlay.machining.modules]
serialization = false
coa = false

[overlay.machining.words]
lot = "batch"
