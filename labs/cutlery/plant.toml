# The cutlery plant, as a pack.
#
#     fsmes demo cutlery                    from the package, no checkout
#     FSMES_PLANT_REGISTRY=labs/cutlery/fleet.toml fsmes plant cutlery start
#
# Eighty-three machines on sixty-one lines, at a hundredth of the customer's
# rate: the teaching pace the crew's lab runs at, where a person can watch a
# fork line make twenty-three forks a minute and the database stays small.
# The customer's own rate - sixty million ids a day - is a scored run
# (run_cutlery.py), never this pack.
#
# Its equipment, materials, routings, specs, lots and order book are files in
# masterdata/, generated once from line.json by init.py and committed, the way
# bottling's line became files on 2026-09-14: a pack carries no code (decision
# 0022), and a plant that needed a script run first could not ship in the
# package. masterdata/README.md says which commands regenerate them.

[pack]
format   = 1
requires = ">=0.1.2"

[plant]
name     = "cutlery"
label    = "Cutlery Works — 83 machines, every piece judged by a vision station"
timezone = "America/Chicago"
profile  = "laptop"

# No [storage]: the plant keeps one SQLite file in its fleet's data directory,
# as bottling does, which is what `fsmes demo cutlery` wants on a PC. For
# PostgreSQL, add it here:
#
#     [storage]
#     database_url           = "postgresql+psycopg://fsmes@localhost:5432/cutlery"
#     database_password_file = "~/.config/fsmes/pg-password"
#
# (The crew's lab adds its own, on its own cluster.)

[serve]
api_host     = "127.0.0.1"
api_port     = 8040
opc_endpoint = "opc.tcp://127.0.0.1:4844/fsmes/cutlery"
simulate     = true
# Real time: OEE is only honest at 1x. A scored run passes its own --speed.
speed        = 1

[files]
tag_map    = "tag_map.json"
replay_dir = "out"
# The plant itself, as data. Six of its files are generated by init.py from
# line.json; the two vocabularies - the words an operator picks from when a
# machine stops, and the severities a finding is raised at - are written by a
# person, because no generator should be inventing words people read.
masterdata = "masterdata"
# What the simulated floor does that the generators do not say: one planned
# order kept behind every line, each line's book continued on its own line.
# Read only by `fsmes run-operations`.
floor      = "floor.json"

[floor]
# The quality plan: every dimensional specification, every fifteen minutes.
inspect_every = 900
inspect_all   = true
