[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factorysemantics-mes"
# The version is not written here. Hatchling reads it out of
# `src/fsmes/__init__.py` (see [tool.hatch.version] below), so the number the
# software states about itself and the number stamped into the wheel cannot be
# two different facts. 0.1.2 shipped with them a version apart.
dynamic = ["version"]
description = "An open-source, modular, agent-native Manufacturing Execution System"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Scott Kalwei" }]
keywords = [
    "mes",
    "manufacturing",
    "manufacturing-execution-system",
    "isa-95",
    "opc-ua",
    "oee",
    "spc",
    "mcp",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
# Merged from both projects at the MES-TWIN adoption. The M0 note about only
# declaring what the code imports still holds — every dependency below is
# imported by code now in this repo, because the engine arrived with it.
dependencies = [
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
    "httpx>=0.27",
    "asyncua>=1.1.5",
    # Windows ships no IANA time-zone database, so `zoneinfo` there cannot
    # resolve `America/Chicago` - or even `UTC` - without this. Windows is a
    # first-class target (plant PCs run this), and the inbound folder driver
    # reads a plant's exports in the plant's own local time. Without the
    # database the only alternatives are to refuse every timestamped file or
    # to read local time as UTC, and the second is how every stop in a shift
    # ends up hours out. Not needed on Linux or macOS, which have one.
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
# The simulation MCP server. Deliberately optional: a plant PC runs the MES,
# not the tooling that tests it, and principle 5 says that PC should stay as
# thin as it can.
mcp = ["mcp>=2"]
# The agent behind the floor assistant: a cloud model working the plant's
# own tools from the same registry the MCP server serves. Optional for the
# same reason: a plant with no key and no internet still answers and guides.
agent = ["anthropic>=1.2", "mcp>=2"]
# The unified-namespace publisher's MQTT client. Optional for the same
# reason as the rest: a plant that does not speak MQTT should not carry an
# MQTT library, and the core install must stay as thin as it can.
mqtt = ["aiomqtt>=2.3"]
# The hosted judgment model's client, used by the development build loop's
# run-log triage and by nothing in the product. Optional for the strongest
# version of the same reason: a plant PC must not carry the client for a
# service it is never allowed to call, and shadow mode refuses that call
# outright. Nothing needs this extra - every caller keeps the answer it
# computes without one.
jev = ["typesafe-sdk>=0.1"]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    "mike>=2.1",
    "mkdocs-redirects>=1.2",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.17.0",
    # The UI conformance loop drives a real browser. Dev-only by principle 5:
    # a plant PC renders the screens; it never carries the tooling that
    # audits them.
    "playwright>=1.49",
]

[project.urls]
Homepage = "https://factorysemantics.com"
Documentation = "https://docs.factorysemantics.com"
Source = "https://github.com/factorysemantics/factorysemantics-mes"
Changelog = "https://github.com/factorysemantics/factorysemantics-mes/blob/main/CHANGELOG.md"
Issues = "https://github.com/factorysemantics/factorysemantics-mes/issues"
Discussions = "https://github.com/factorysemantics/factorysemantics-mes/discussions"
Roadmap = "https://github.com/factorysemantics/factorysemantics-mes/blob/main/ROADMAP.md"

# Modules register here. `fsmes info` lists what is installed by reading this
# group, and the ERP factory resolves any mode it does not know built-in by
# name, so a connector published as its own package plugs in the same way.
[project.entry-points."fsmes.modules"]
erpnext = "fsmes.integrations.erp.erpnext_adapter:from_settings"

[project.scripts]
fsmes = "fsmes.cli:run"

# One number, in one file. `__version__` is what `fsmes --version`, `fsmes info`
# and the API's OpenAPI document report, and it is what hatchling stamps into
# the distribution metadata — so a release bumps `src/fsmes/__init__.py` and
# nothing else. Reading it here rather than reading the metadata from the
# package means the number is also correct in a source checkout, where there is
# no installed distribution to ask.
[tool.hatch.version]
path = "src/fsmes/__init__.py"

# The migrations live inside the package (src/fsmes/migrations), so `packages`
# carries them into the wheel with everything else. That is deliberate and
# load-bearing: a plant that installed from PyPI has no checkout, and before
# 2026-09-10 that meant `fsmes init-db` silently skipped every ALTER.
[tool.hatch.build.targets.wheel]
packages = ["src/fsmes"]

# The demo and the defaults read config/*.json relative to the working
# directory, which exists in a checkout and nowhere else. The wheel carries
# the same files as package data; Settings falls back to them when the
# relative path is absent (see fsmes.config.packaged_default).
[tool.hatch.build.targets.wheel.force-include]
"config/tag_map.json" = "fsmes/data/config/tag_map.json"
"config/line_layout.json" = "fsmes/data/config/line_layout.json"
"config/tag_map_kepsim.json" = "fsmes/data/config/tag_map_kepsim.json"
"config/tag_map_kepware.json" = "fsmes/data/config/tag_map_kepware.json"
"config/inbound_mapping.json" = "fsmes/data/config/inbound_mapping.json"
"config/inbound_sql.json" = "fsmes/data/config/inbound_sql.json"

# THE TWO LAB PLANTS, AS PACKS. So that `pip install factorysemantics-mes` and
# then `fsmes demo bottling` brings the bottling plant up on a machine with no
# checkout anywhere - which is what a customer's site is. Before this, the
# 0.2.0 wheel carried no file under `labs/`, `fsmes plant` wanted a repository
# root and a fleet file, and everything the plant demonstrates lived only in a
# checkout.
#
# These are copies at build time and never a second source of truth. Two things
# keep them honest: `tests/test_the_wheel_ships_the_lab_packs.py` fails when a
# file is added to either pack and not listed here, and the `wheel-plant` CI job
# diffs the shipped tree against `labs/multiplant/<name>` byte for byte.
#
# Listed file by file rather than as two directories because hatchling's
# force-include copies whatever is on disk and honours neither `exclude` nor
# `.gitignore` (measured 2026-10-12, hatchling 1.x) - and `out/`, the generated
# replay, is 9.7 MB for bottling and must not ship. `masterdata/` is a directory
# because nothing generated is ever written into it.
"labs/multiplant/bottling/plant.toml" = "fsmes/data/packs/bottling/plant.toml"
"labs/multiplant/bottling/line.json" = "fsmes/data/packs/bottling/line.json"
"labs/multiplant/bottling/floor.json" = "fsmes/data/packs/bottling/floor.json"
"labs/multiplant/bottling/tag_map.json" = "fsmes/data/packs/bottling/tag_map.json"
"labs/multiplant/bottling/masterdata" = "fsmes/data/packs/bottling/masterdata"
"labs/multiplant/machining/plant.toml" = "fsmes/data/packs/machining/plant.toml"
"labs/multiplant/machining/line.json" = "fsmes/data/packs/machining/line.json"
"labs/multiplant/machining/floor.json" = "fsmes/data/packs/machining/floor.json"
"labs/multiplant/machining/tag_map.json" = "fsmes/data/packs/machining/tag_map.json"
"labs/multiplant/machining/masterdata" = "fsmes/data/packs/machining/masterdata"

# THE ASSISTANT FOLDER, INSIDE THE WHEEL. `fsmes skills unpack plant-from-your-mes
# <dir>` writes it out on a machine with no checkout and no internet, which is
# the first step of building a plant shaped like your own: the folder goes onto
# the MES box, somebody runs the three commands in its SKILL.md by hand, and a
# `plant-shape.toml` comes back. Before this it existed only as a zip on a
# release page, which is a download, which is a thing a locked-down plant
# network does not do.
#
# Same arrangement as the packs above: build-time copies, never a second source
# of truth, listed file by file because force-include honours no exclusion and a
# stray `__pycache__` from somebody running the scripts in place would ship.
# `tests/test_the_wheel_ships_the_assistant_folder.py` fails when a file is in
# `fsmes.skills.SKILLS` and not here.
# The assistant folder itself: four stages of plain markdown that any agent can
# read — install, a plant shaped like yours, shadow mode, and an honest page on
# what migration would still need. `plant-from-your-mes` is its stage 2 and is
# NOT copied in here: `fsmes.skills.INCLUDES` says the assistant carries that
# folder, and `fsmes skills unpack assistant` nests it at unpack time from the
# one copy below. One copy in git, no symlink (a zipped symlink unpacks on
# Windows as a text file with a path in it).
"skills/assistant/SKILL.md" = "fsmes/data/skills/assistant/SKILL.md"
"skills/assistant/README.md" = "fsmes/data/skills/assistant/README.md"
"skills/assistant/0-how-to-help.md" = "fsmes/data/skills/assistant/0-how-to-help.md"
"skills/assistant/1-install.md" = "fsmes/data/skills/assistant/1-install.md"
"skills/assistant/2-your-plant.md" = "fsmes/data/skills/assistant/2-your-plant.md"
"skills/assistant/3-shadow-mode.md" = "fsmes/data/skills/assistant/3-shadow-mode.md"
"skills/assistant/4-migration.md" = "fsmes/data/skills/assistant/4-migration.md"

"skills/plant-from-your-mes/SKILL.md" = "fsmes/data/skills/plant-from-your-mes/SKILL.md"
"skills/plant-from-your-mes/FORMAT.md" = "fsmes/data/skills/plant-from-your-mes/FORMAT.md"
"skills/plant-from-your-mes/example/plant-shape-grouped.toml" = "fsmes/data/skills/plant-from-your-mes/example/plant-shape-grouped.toml"
"skills/plant-from-your-mes/example/plant-shape.toml" = "fsmes/data/skills/plant-from-your-mes/example/plant-shape.toml"
"skills/plant-from-your-mes/queries/mssql/01_inventory.sql" = "fsmes/data/skills/plant-from-your-mes/queries/mssql/01_inventory.sql"
"skills/plant-from-your-mes/queries/mssql/01b_row_count.sql" = "fsmes/data/skills/plant-from-your-mes/queries/mssql/01b_row_count.sql"
