[tool.hatch.build.targets.sdist]
exclude = [".claude/", "site/", "docs/reference/"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
# Executed notebooks are exports, not source; their cells are linted where they are written (build_notebook.py).
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends()/Query() and typer's Option()/Argument() in defaults are
# those frameworks' own idiom, not the mutable-default trap B008 exists for.
"src/fsmes/api/**" = ["B008"]
"src/fsmes/cli.py" = ["B008"]
# Alembic generates migrations at whatever width it likes.
"src/fsmes/migrations/versions/*" = ["E501"]
# Notebook cells, written as strings: a long line there is a long line in a cell.
"labs/cutlery/analysis/build_notebook.py" = ["E501"]
"labs/cutlery/analysis/build_report.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: tests that start real servers or drive a simulated plant end to end",
    # Every test that drives Chromium. A subset of `slow` - each of these
    # starts a real server too - selected on purpose by CI's `browser` job:
    # `pytest -m browser`. It exists because "run the slow tier" and "run the
    # browser tier" are not the same ask: the slow tier also holds the ERPNext
    # round trip, which needs a live ERPNext, and the KEPSim replay, which is
    # red (see its own marker). Those two must not be able to keep a browser
    # regression from going red. `tests/test_every_browser_test_is_in_the_browser_tier.py`
    # fails if a file that imports Playwright is missing this marker.
    "browser: tests that drive Chromium through Playwright",
    # Deselected by default like every slow test, and selected on purpose by
    # the erpnext-live workflow: `pytest -m erpnext_live`. These need a real
    # ERPNext and fail, rather than skip, when there is not one.
    "erpnext_live: the ERPNext round trip, against a real ERPNext",
]
