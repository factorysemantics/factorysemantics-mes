# SPC on the line: a reading arrives, trips a rule, and an operator takes the hold.
#
# The first take of this scene filmed a chart that was already out of control
# when the camera arrived, on the lab plant, which no take may write to. It was
# honest and it was flat: nothing happened, and the operator's part of the
# story — deciding to look at a hold — is a write.
#
# So this take brings up its own plant, films the event happening, and lets the
# operator do the one thing the story is about.

name = "spc-on-the-line"
title = "SPC on the line"
out = "~/Work/gifs/mes-fundamentals/02-spc-on-the-line"
base = "http://127.0.0.1:8010"
badge = "pre-alpha · simulated plant · v{version}"
budget_seconds = 45
gif_skip_seconds = 2.5
width = 1280
height = 720

# Taking a hold under review is a write, and without it this is a tour of two
# screens rather than somebody doing their job. The runner honours this only
# against a plant at a loopback address — the scratch plant below — and refuses
# the take outright against anything else, because the lab plants and the
# public demo answer on this box too and somebody is reading them.
allow_writes = true

[plant]
# The plant this take films is built fresh from the same pack the lab's
# bottling plant uses, in a temporary home, on the ports that pack names
# (8010 and 4841), and is stopped and deleted when the take ends. The lab
# plant is not touched, read, or pointed at.
pack = "labs/multiplant/bottling"

# One wall second is twenty line seconds. The speed is not a matter of taste:
# the chart's limits are estimated from the gaps between consecutive readings,
# so a faster replay samples more of the line between them, widens sigma, and
# swallows the very step this scene is about. At 60x the filler's scripted
# four-gram drop is barely one sigma and fires nothing at all. At 20x sigma
# settles around 2.4 g, the chart is in control about twenty-five seconds in,
# and the drop the pack's own line.json scripts at line second 2400 arrives
# around a hundred and fifteen seconds in and fires rule 2 about ten seconds
# after that.
speed = 20

# Where the camera starts rolling. The runner waits here, off camera, because a
# wait inside the scene is filmed and the clip has forty-five seconds: holding
# on an unchanging chart for a minute and a half would be the whole clip.
#
# It waits for the chart to be in control AND for the newest reading to be two
# sigma or more from centre. That is the first reading of the filler's drop —
# the one that fires no rule by itself, because rule 2 wants two of three out
# there. So the camera opens on a chart that is genuinely in control with the
# trouble already visible at the bottom of it, and the rule fires while the
# camera is on the chart instead of before it arrived.
roll_when_chart = "FG-BOTTLE/fill_weight"
roll_when_in_control = true
roll_when_beyond_sigma = 2.0
roll_when_timeout_seconds = 300

# --- the chart, in control

[[step]]
do = "goto"
url = "/dashboard/spc?spec=FG-BOTTLE%7Cfill_weight"
settle = 3.0

[[step]]
do = "wait_for"
selector = "#verdict"
text = "in control"

# The page opens at the top, where the verdict is; the chart is below the fold
# on a 720-high frame, because this plant's replay banner and the navigation
# take the first 190 pixels. So the camera is put on the chart and kept there:
# the clip is about a point moving, and a point nobody can see moves for
# nobody. `start` with an offset of 215 puts the chart's top just under the
# header that stays on screen.
[[step]]
do = "say"
line = "Fill weight on the bottling line. The chart is in control."
hold = 4.5
scroll_to = "#chart"
scroll_block = "start"
scroll_offset = 215

[[step]]
do = "mark"
name = "the-chart-in-control"

# --- the reading that trips it, while the camera is on the chart

# The one wait that is filmed, and the only one that should be: this is the
# event. It is a few seconds at the speed above, and the take is measured and
# refused if the plant made it a long one.
[[step]]
do = "wait_for"
selector = "#verdict"
text = "out of control"
timeout = 120

# The same framing again, not because the reader scrolled but because the
# verdict above the chart just grew by a line and pushed it down. The rules
# this firing raised are listed further down the page, and that table is left
# off camera: the hold on the quality page two shots from here says the same
# thing, and it says it where a person would act on it.
[[step]]
do = "say"
line = "A reading drops, and the chart calls it: out of control."
hold = 5.0
scroll_to = "#chart"
scroll_block = "start"
scroll_offset = 215

[[step]]
do = "mark"
name = "the-reading-that-tripped-it"

[[step]]
do = "wait_for"
selector = "#f-cp"
text = "withheld"

# Up to the summary row, where Cp and Cpk now read "withheld", with the
# verdict under them saying so in words. This is the one number the product
# refuses to print, and refusing it is the point.
[[step]]
do = "say"
line = "Capability is withheld now — a number on an unstable process would be a lie."
hold = 5.0
scroll_to = "#verdict"
scroll_block = "start"
scroll_offset = 320

# --- the hold, and the operator

[[step]]
do = "goto"
url = "/dashboard/quality?material=FG-BOTTLE&characteristic=fill_weight&n_q=SPC+rule"
settle = 2.5

# "SPC rule" and not the name of one rule. Which rule catches this reading is
# the chart's business and not the scene's: the drop is scripted into the
# pack's line, but how many readings landed before it — and so how wide the
# limits are when it arrives — moves by a reading or two between takes, and a
# scene that waits for rule 2 by name waits for ever on the take where rule 1
# got there first. The rule is named on camera by the plant, in the hold, which
# is the only place it should be named from.
[[step]]
do = "wait_for"
selector = "#ncs"
text = "SPC rule"

[[step]]
do = "say"
line = "The chart raised the hold itself, and named the rule and the readings."
hold = 5.0
scroll_to = "#ncs"
scroll_block = "start"
scroll_offset = 250

[[step]]
do = "click"
selector = "button[data-assist=\"nc-review\"]"

[[step]]
do = "wait_for"
selector = "#ncs"
text = "under review"

[[step]]
do = "say"
line = "The operator takes it under review. On the record."
hold = 4.5

[[step]]
do = "mark"
name = "the-hold-under-review"
