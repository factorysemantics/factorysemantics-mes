# The class: five modules, eighteen lessons, in the order they are taught.
#
# `scripts/record-scene.py --course` turns this file, and the lesson folders
# already filmed, into `course.json` and the README at the top of the tree
# (`out` below). Nobody edits course.json by hand. A lesson's scene names its
# lesson with `lesson = "2.1"`; the folder it films into is
# `<out>/NN-<module slug>/NN-<lesson slug>/`, numbered by the order here.
#
# A slug never changes once a lesson is published: studio, the dashboard and
# the website find a lesson by it. The titles and lines come from the
# accepted syllabus (2026-10-26); `outcomes` are the "you now know" lines and
# are written when a lesson is written, not before — an empty list says not
# yet, not none.

[course]
slug = "fsmes-class"
title = "FactorySemantics MES — the class"
voice = "Brian"
status_line = "pre-alpha · simulated plant"
out = "~/Work/gifs/course"

# ------------------------------------------------------------------ module 1
[[module]]
order = 1
slug = "what-an-mes-is-for"
title = "What an MES is for"

[[module.lesson]]
order = 1
slug = "the-plant-between-erp-and-machines"
title = "The plant between the ERP and the machines"
one_line = "What an MES records that neither the ERP nor the machines can."

[[module.lesson]]
order = 2
slug = "never-invent-production"
title = "Never invent production"
one_line = "The MES counts what the machine counted, and says unknown when it did not see."
outcomes = [
  "Say what coverage means on any FactorySemantics screen.",
  "Explain why a figure reads 'unknown' and why that is not a bug.",
  "Find the coverage number on the shift rollup.",
]
knows_before = ["1.1"]

[[module.lesson]]
order = 3
slug = "a-work-orders-day"
title = "A work order's day"
one_line = "Release, routing, station to station, finish."
scene = "scripts/scenes/04-work-orders-and-routings.toml"

