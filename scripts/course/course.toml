# The class, draft 2: seven modules, twenty-five classes, in the order they are taught.
#
# `scripts/record-scene.py --course` turns this file, and the lesson folders
# already filmed, into `course.json` and the README at the top of the tree
# (`out` below). Nobody edits course.json by hand.
#
# Two numbers, never confused:
#
# * `order` is position, 1-based. The folder a class films into is
#   `<out>/NN-<module slug>/NN-<lesson slug>/`, NN being the module's and the
#   lesson's `order`; course.json's `path` says the same, and readers go by
#   `path`, never by the label.
# * `label` is the number people say: "class 0.1", "tier 3". It is what a scene
#   names its class by (`lesson = "0.1"`), what the README prints, and it may
#   skip (3.2 was struck, so tier 3 reads 3.1, 3.3, 3.4).
#
# A slug never changes once a lesson has work on it: studio, the dashboard and
# the website find a lesson by it, which is why two classes keep their draft-1
# slugs below. Titles and lines come from the outline of 2026-11-14 (draft 2);
# `outcomes` are the "you now know" lines and are written when a class is
# written, not before — an empty list says not yet, not none.

[course]
slug = "fsmes-class"
title = "FactorySemantics MES — the class"
voice = "Brian"
status_line = "pre-alpha · simulated plant"
out = "~/Work/gifs/course"

# Folders draft 1 filmed, and where each one's class lives now. The recorder
# moves nothing: it lists these in the tree's README so whoever keeps work
# beside a folder moves their own side in the same step. A folder whose class
# is no longer in the course says so in `kept_outside`.

[[moved]]
from = "01-what-an-mes-is-for/02-never-invent-production"
kept_outside = "draft 1's bottling take of Never invent production, voiced; kept on disk as it is, outside the course, and nothing reads it"

[[moved]]
from = "01-what-an-mes-is-for/03-a-work-orders-day"
slug = "a-work-orders-day"

[[moved]]
from = "02-quality-on-the-line/01-spc-the-chart-notices-first"
slug = "spc-the-chart-notices-first"

