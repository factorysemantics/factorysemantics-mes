site_name: FactorySemantics MES
site_url: https://docs.factorysemantics.com/
site_description: An open-source, modular, agent-native Manufacturing Execution System.
repo_url: https://github.com/factorysemantics/factorysemantics-mes
repo_name: factorysemantics/factorysemantics-mes
edit_uri: edit/main/docs/
copyright: Apache-2.0. Every number on this site comes from a simulated plant unless it says otherwise.

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.tabs.link
    - content.code.copy
    - content.action.edit
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Light

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: google
            members_order: source

hooks:
  - docs/hooks/generate.py

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/factorysemantics/factorysemantics-mes
    - icon: fontawesome/solid/globe
      link: https://factorysemantics.com

not_in_nav: |
  ai/*
  design/backlog/*
  onboarding/README.md

