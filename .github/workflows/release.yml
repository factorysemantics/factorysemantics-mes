name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: The tag and the package agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls dist/ | grep -q "factorysemantics_mes-${v}-" || { echo "::error::tag $GITHUB_REF_NAME but wheel is $(ls dist/)"; exit 1; }
      # The wheel's filename comes from src/fsmes/__init__.py now, so the step
      # above already ties the tag to the number the CLI reports. CITATION.cff
      # is the one version left that a human types: the citation file format
      # has no way to read it from the package. It was a release behind when
      # this check was written, and 0.1.2 is what a wrong number costs. A tag
      # whose citation disagrees stops here, before anything is published.
      - name: The tag and the citation file agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          cited="$(sed -n 's/^version: *//p' CITATION.cff)"
          [ "$cited" = "$v" ] || { echo "::error::tag $GITHUB_REF_NAME but CITATION.cff says ${cited:-nothing}"; exit 1; }
      - name: The wheel carries the demo's config files
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["fsmes/data/config/tag_map.json", "fsmes/data/config/line_layout.json"]
          missing = [n for n in need if n not in names]
          sys.exit(f"::error::wheel lacks {missing}" if missing else 0)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheel-demo:
    # The `build` job checks the wheel's filename and that the config files
    # are inside it. Both were true of a wheel that still did not run. This
    # runs the demo from the exact artifact about to be published — not a
    # rebuild of it — so a tag cannot publish a wheel that does not work.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: The wheel that is about to be published runs the demo
        run: .github/scripts/demo_from_wheel.sh "$(ls dist/*.whl)"

  pypi:
    needs: [build, wheel-demo]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/factorysemantics/fsmes
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes ghcr.io/factorysemantics/fsmes:${GITHUB_REF_NAME#v}
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/factorysemantics/fsmes:${{ steps.meta.outputs.version }}
          artifact-name: sbom.spdx.json

  github-release:
    needs: [pypi, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {if(p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
