name: Release

# TWO WAYS IN, AND ONLY ONE OF THEM PUBLISHES.
#
# A tag is the real thing: it builds, checks, runs the demo from the wheel,
# publishes to PyPI, pushes and signs the image, and cuts the GitHub Release.
#
# `workflow_dispatch` is a rehearsal. Every job that produces evidence runs;
# every job that makes something public is skipped by `if:`. It exists because
# this file used to be provable only by tagging: a bumped action, a changed
# Dockerfile or a broken artifact hand-off would be found on release night,
# which is the night decision 0018 exists because of. Now it can be found on a
# Tuesday. Nothing about the tag path depends on the dispatch path being run.
#
# The three jobs that are skipped on a dispatch, and only those: `pypi`,
# `image-push` (the registry push, the cosign signature and the SBOM), and
# `github-release`. The `image` job still runs, building both platforms
# through the same Dockerfile and the same buildx and throwing the result
# away.
#
# ONE DECISION, ONE CONSEQUENCE.
#
# `pypi` is the reviewer-gated environment: a human approves it, and that
# approval is the decision to publish this version. Everything public waits
# behind it. `image` builds the container before the gate — that is evidence,
# and `pypi` needs it, so a Dockerfile that no longer builds stops the run
# before anyone is asked to approve anything. `image-push` needs `pypi`, so
# the bytes reach ghcr.io only after that approval, in the same run, or not
# at all.
#
# It was not always so. On 2026-09-14 the v0.2.0 run waited at the gate while
# ghcr.io already served `fsmes:0.2.0` and pointed `latest` at it, with PyPI
# still on 0.1.2 and no GitHub Release: for the length of that wait, anyone
# pulling `latest` got a version nothing else in the project acknowledged.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      # The version this run is about, taken from the wheel that was just
      # built. On a tag the next step asserts the tag says the same thing, so
      # the pair is exactly the check that was here before: tag, wheel,
      # citation, all one number. On a dispatch there is no tag, and the wheel
      # is the subject instead — which is what makes the citation check below
      # runnable before anyone tags anything.
      - name: The version in the wheel
        id: v
        run: |
          set -euo pipefail
          w=$(ls dist/*.whl)
          v=$(basename "$w" | sed -n 's/^factorysemantics_mes-\([^-]*\)-.*/\1/p')
          [ -n "$v" ] || { echo "::error::cannot read a version out of $w"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "this run is about $v"
      - name: The tag and the package agree
        if: github.event_name == 'push'
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "${{ steps.v.outputs.version }}" = "$v" ] || { echo "::error::tag $GITHUB_REF_NAME but wheel is $(ls dist/)"; exit 1; }
      # The wheel's filename comes from src/fsmes/__init__.py now, so the step
      # above already ties the tag to the number the CLI reports. CITATION.cff
      # is the one version left that a human types: the citation file format
      # has no way to read it from the package. It was a release behind when
      # this check was written, and 0.1.2 is what a wrong number costs. A tag
      # whose citation disagrees stops here, before anything is published --
      # and a dispatch whose citation disagrees says so before the tag exists.
      - name: The package and the citation file agree
        run: |
          v="${{ steps.v.outputs.version }}"
          cited="$(sed -n 's/^version: *//p' CITATION.cff)"
          [ "$cited" = "$v" ] || { echo "::error::wheel is $v but CITATION.cff says ${cited:-nothing}"; exit 1; }
      - name: The wheel carries the demo's config files
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          need = ["fsmes/data/config/tag_map.json", "fsmes/data/config/line_layout.json"]
          missing = [n for n in need if n not in names]
          sys.exit(f"::error::wheel lacks {missing}" if missing else 0)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  wheel-demo:
    # The `build` job checks the wheel's filename and that the config files
    # are inside it. Both were true of a wheel that still did not run. This
    # runs the demo from the exact artifact about to be published — not a
    # rebuild of it — so a tag cannot publish a wheel that does not work.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: The wheel that is about to be published runs the demo
        run: .github/scripts/demo_from_wheel.sh "$(ls dist/*.whl)"

  pypi:
    # Publishes. Tag only. This is the gate: the `pypi` environment holds the
    # run until a reviewer approves it, and every public step in this file is
    # downstream of that approval. It needs `image` as well as the wheel, so
    # a container that no longer builds fails the run before the reviewer is
    # asked — nothing is published on the strength of half the artefacts.
    if: github.event_name == 'push'
    needs: [build, wheel-demo, image]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  image:
    # Builds. Pushes nothing, ever, on either path — `push: false` is not
    # conditional. Both platforms go through the same Dockerfile and the same
    # buildx as the real push, so a broken Dockerfile or a platform that no
    # longer compiles is a red job here: on a dispatch, before a tag exists;
    # on a tag, before the reviewer is asked to approve anything.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      # The tags are never used here — nothing is pushed — but working out what
      # they would be is part of what a rehearsal is for. This is where a
      # metadata action that has changed its mind about `latest` shows up.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/factorysemantics/fsmes
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `image-push` reads this cache, so on a tag the layers it pushes are
          # the ones this job already built rather than a second build of the
          # same commit. A miss costs that job the build time again; it does
          # not change what ships, and an export that fails stops the run here,
          # with nothing published.
          cache-to: type=gha,mode=max

  image-push:
    # Publishes. Tag only, and only after the gate. `needs: pypi` is the whole
    # point of this job existing apart from `image`: it is what keeps ghcr.io
    # from carrying a version the reviewer has not approved.
    if: github.event_name == 'push'
    needs: [image, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/factorysemantics/fsmes
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        run: cosign sign --yes ghcr.io/factorysemantics/fsmes:${GITHUB_REF_NAME#v}
      - uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/factorysemantics/fsmes:${{ steps.meta.outputs.version }}
          artifact-name: sbom.spdx.json

  github-release:
    # Publishes. Tag only.
    if: github.event_name == 'push'
    needs: [pypi, image-push]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\["v"\\]" {p=1; next} /^## \[/ {if(p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: dist/*
