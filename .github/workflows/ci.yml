name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target, not an afterthought: this MES is
        # expected to run on plant PCs, and the single-writer lock exists in
        # its O_EXCL form precisely because there is no fcntl there.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,agent]"

      - name: Lint
        run: python -m ruff check .

      # The skill folders that ship as zips on a release. A second's work, and
      # it is the only thing that notices a file added to a skill and never
      # added to its shipping list — or a scratch file left in the folder that
      # would otherwise be packaged and sent to somebody's plant.
      - name: Every skill folder matches its shipping list
        run: fsmes skills-zip --check

      - name: Test
        run: python -m pytest

  postgres:
    # The suite against a real PostgreSQL, because a plant runs one.
    #
    # Everything else here runs on in-memory SQLite. SQLite is forgiving in
    # ways PostgreSQL is not — LIKE ignores case, GROUP BY tolerates a bare
    # column, a failed statement does not poison the transaction — so a bug
    # that only shows on PostgreSQL is invisible to the rest of this file.
    # This cell is where it shows: on a runner, not on a plant PC.
    #
    # One cell, Ubuntu, one Python. What this catches is a dialect
    # difference, not a platform or interpreter difference, so multiplying
    # the matrix would buy nothing and cost four times the minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # Pinned by digest, not by tag: `postgres:16` is a moving target and
        # a green run has to mean the same bytes passed. This is 16.15.
        # Moving the pin is a pull request, which is when it gets re-proven.
        image: postgres@sha256:f1c3376c26f2609ab9f29f71f824103fe2fcd8ee0346485cb6122a4f93df6f94
        env:
          POSTGRES_USER: fsmes
          POSTGRES_PASSWORD: fsmes
          POSTGRES_DB: fsmes
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fsmes -d fsmes"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The suite's database. Not MES_DATABASE_URL — see tests/conftest.py for
      # why the two are kept apart.
      MES_TEST_DATABASE_URL: postgresql+psycopg://fsmes:fsmes@127.0.0.1:5432/fsmes
      # Alembic reads the deployment setting, so the migration step below
      # points that at the same server.
      MES_DATABASE_URL: postgresql+psycopg://fsmes:fsmes@127.0.0.1:5432/fsmes

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The same extras as `test`, plus the PostgreSQL driver.
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,agent,postgres]"

      # First, while the database is still empty: the migrations. A chain
      # that has only ever run on SQLite is the likeliest thing here to be
      # quietly wrong, and `alembic upgrade head` from nothing is the only
      # way a plant ever gets its schema. One head, checked here as well as
      # in the suite, because a second head fails this step in a way that is
      # hard to read otherwise.
      - name: alembic upgrade head, from empty, on PostgreSQL
        run: |
          set -euo pipefail
          heads=$(python -m alembic heads | grep -c . || true)
          if [ "$heads" != "1" ]; then
            echo "expected exactly one migration head, found $heads:"
            python -m alembic heads --verbose
            exit 1
          fi
          started=$(date +%s)
          python -m alembic upgrade head
          echo "PG_ALEMBIC_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"
          python -m alembic current
          # And the path a plant actually uses: the migrations resolved from
          # the package rather than from this directory. `db-status` exits
          # non-zero unless the database is at the head the package ships, so
          # the two ways of asking have to agree, on PostgreSQL as well.
          fsmes db-status
          # And back down one, and up again. A downgrade is the step a plant
          # reaches for at the worst possible moment, and on PostgreSQL it is
          # the one most likely to be quietly wrong: SQLite rewrites a table
          # to drop a column and never notices a constraint that has no name,
          # while PostgreSQL drops it by the name the upgrade gave it. Only
          # the newest revision, because that is the one this pull request
          # wrote and walking the whole chain down would say nothing about it
          # that is not already said by building it up.
          python -m alembic downgrade -1
          python -m alembic upgrade head
          fsmes db-status

      # The suite drops the migrated schema and builds its own from the
      # model, which is the same thing every other cell does. Running it
      # second means the step above genuinely started from empty.
      - name: Test
        run: |
          set -euo pipefail
          started=$(date +%s)
          python -m pytest
          echo "PG_TEST_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"

      - name: What this run cost
        if: always()
        run: |
          {
            echo "| Step | Seconds |"
            echo "|---|---|"
            echo "| alembic upgrade head | ${PG_ALEMBIC_SECONDS:-—} |"
            echo "| Suite on PostgreSQL 16.15 | ${PG_TEST_SECONDS:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"

  browser:
    # Every test that drives Chromium, on every pull request.
    #
    # Until 2026-09-25 this tier existed and nothing ran it. The browser tests
    # are `slow`, the default selection is `-m 'not slow'`, and every job in
    # this file uses the default - so the whole tier was opt-in, and opt-in
    # tests rot. `test_ui_nav.py`'s Configuration-page count had been red on
    # `main` since PR #104 merged, through a day of green checks, because
    # nobody happened to type `pytest -m slow`.
    #
    # It is its own job rather than a step in `test` because it needs a
    # browser binary, which is a ~170 MB download the other cells have no use
    # for. One cell, Ubuntu, one Python: what a browser test catches is a
    # rendered page, not a platform or interpreter difference, so multiplying
    # the matrix would cost four browser downloads and catch nothing more.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,mcp,agent]"
      # Chromium only. The suite drives no other engine, and installing the
      # three Playwright ships would triple the download for nothing.
      # `--with-deps` is what makes a headless browser work on a bare runner.
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
      - name: The browser tests
        run: |
          set -euo pipefail
          started=$(date +%s)
          python -m pytest -m browser
          echo "BROWSER_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"

      # The rest of the slow tier, in the same job because it is four tests and
      # seconds long, and because leaving it out would leave exactly the hole
      # this job exists to close. Two exclusions, both stated rather than
      # quietly dropped:
      #
      # - `erpnext_live` needs a real ERPNext and fails - deliberately, not
      #   skips - without one. It has its own workflow, erpnext-live.yml.
      # - The KEPSim replay end-to-end is red. It runs here and is marked
      #   xfail with the reason in the test file; it is not skipped, and it is
      #   not strict, so a day it starts passing shows up as XPASS rather than
      #   as a red check on somebody else's pull request.
      - name: The rest of the slow tier
        run: |
          set -euo pipefail
          started=$(date +%s)
          python -m pytest -m "slow and not browser and not erpnext_live" -rxXs
          echo "SLOW_SECONDS=$(( $(date +%s) - started ))" >> "$GITHUB_ENV"

      - name: What this run cost
        if: always()
        run: |
          {
            echo "| Step | Seconds |"
            echo "|---|---|"
            echo "| Browser tests, pytest -m browser | ${BROWSER_SECONDS:-—} |"
            echo "| The rest of the slow tier | ${SLOW_SECONDS:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"

  wheel-demo:
    # The check that would have caught 0.1.0. `test` above proves the source
    # works; this proves the *artifact* works — installed into a fresh venv in
    # an empty directory, which is all a stranger with pipx ever has. One cell
    # on Ubuntu and one Python is enough: what this catches is missing package
    # data, not a platform difference.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: The wheel runs the demo from an empty directory
        run: .github/scripts/demo_from_wheel.sh "$(ls dist/*.whl)"

      # And the other thing a plant does with a wheel: upgrade the database it
      # already has. Until 2026-09-10 the wheel carried no migration scripts,
      # so `fsmes init-db` outside a checkout ran no ALTER and said the schema
      # was up to date - which would have put a plant on new code and an old
      # schema, quietly. This installs the release that is on PyPI now, makes
      # a database with it, upgrades that database with the wheel under test,
      # and asks the database whether it is at head.
      - name: The wheel upgrades a database made by the previous release
        run: .github/scripts/upgrade_from_previous_release.sh "$(ls dist/*.whl)"

  wheel-plant:
    # The check behind the pivot of 2026-10-12: *could a customer spin this up
    # on their own site?* `wheel-demo` above proves the twin runs from a wheel;
    # this proves the plant we actually demonstrate does - the six-station
    # bottling line, its eight-hour shift, the simulated floor and the
    # dashboard - from `pip install` and one command, in a directory holding
    # none of this repository's files.
    #
    # On Windows as well as Linux, and that is the point of the second cell.
    # `docs/operate/compatibility.md` promises plant PCs are Windows; nobody on
    # this project owns one; and until this job existed no plant had ever been
    # started on Windows by anybody. `fsmes plant` had three bugs that only
    # showed there - a detach flag silently ignored, a SIGKILL that does not
    # exist, and a console script looked for in `bin` - and the suite was green
    # the whole time, because the suite never starts a plant.
    #
    # Facts, never seconds: every wait in the script is a poll for a state with
    # a generous ceiling, and the times it prints are information for a release
    # note, not gates. A shared runner makes an absolute bound flaky and says
    # nothing about the code.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # First start generates the shift (seconds), builds the plant and replays
    # until a lot has been counted. Generous on purpose: a runner that is
    # merely slow should not look like a plant that does not come up.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      # One script for both runners rather than a bash step and a PowerShell
      # step: two spellings of one check is how the two drift until only one
      # of them is really run.
      - name: The wheel brings the bottling plant up, and puts it down
        shell: bash
        run: python .github/scripts/plant_from_wheel.py --wheel "$(ls dist/*.whl)" --speed 60

  half-dead-plant:
    # The state a first-time Windows user was stuck in on 2026-10-13: a plant
    # whose dashboard had died while two of its processes were still alive, so
    # it was running and could not be talked to. What he had on screen was two
    # pid numbers, and the stop he was told to type refused to act on a plant
    # it could not reach.
    #
    # This job makes that state on purpose - start the plant from the wheel,
    # kill the API process and nothing else - and proves the product talks a
    # person out of it: `status` names the process that is gone and the log
    # that says why, `stop` recovers it with no flag, and the plant starts
    # again afterwards.
    #
    # Beside `wheel-plant` and on both runners for the same reason: it is all
    # processes, pids and console output, which is exactly where Windows
    # differs, and nobody on this project has a Windows machine to find out on.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: A half-dead plant is described, recovered with no flag, and started again
        shell: bash
        run: python .github/scripts/recover_a_half_dead_plant.py --wheel "$(ls dist/*.whl)" --speed 60

  doctor-leaks-nothing:
    # The file `fsmes doctor` writes is the one thing in this product a person
    # is told to paste somewhere else - to their own agent, or to this project.
    # Its first line promises that no tag name, order number, product, lot,
    # person, host name or database URL is in it. A promise like that is only
    # worth what a check makes it worth, so this job plants a tag named
    # SECRET_TAG_XYZ and an order WO-LEAK-1 in the logs the command reads, runs
    # it against a home with no plant, a running plant in shadow mode, a
    # half-dead one and a stopped one, and greps every file it wrote for them -
    # and for this machine's host name and the user who ran it.
    #
    # Beside `half-dead-plant` and on both runners for the same reason: it is
    # processes, pids, paths and console output, which is exactly where Windows
    # differs, and a plant engineer's PC is a Windows PC.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - name: doctor writes a file with nothing of yours in it, in every state
        shell: bash
        run: python .github/scripts/doctor_writes_nothing_of_yours.py --wheel "$(ls dist/*.whl)" --speed 60

  wheel-plant-from-shape:
    # The whole customer path, from a built wheel, on both runners, with the
    # network off: install, write the assistant folder out of the installation
    # offline, run SKILL.md's three commands on a box that has *no fsmes on it*,
    # and start a plant shaped like the MES those commands read.
    #
    # First step is the folder a person downloads: `fsmes skills list` names
    # `assistant` and `fsmes skills unpack assistant` writes its seven pages
    # with `plant-from-your-mes/` inside them, byte-for-byte the checkout's,
    # with no second copy in git and no symlink. Then the shape path below uses
    # that nested folder for real.
    #
    # Two reference shapes, both all the way to a running dashboard. One is the
    # flat MES - one line, one straight routing, one tag folder per machine, no
    # routing table at all. The other is a brownfield plant: two areas with
    # cells under them, two routings that meet at a shared machine, and two
    # machines sharing one OPC device folder. A converter that has only ever
    # seen one straight line is a converter that gets rewritten at the first
    # customer, so both run on every pull request.
    #
    # The MES box is a second virtual environment with nothing in it, and the
    # script asserts `import fsmes` fails there before it runs a single skill
    # command. That is the only honest way to prove the scripts are
    # stdlib-only: on a plant's MES box there is no fsmes to import.
    #
    # Windows as well as Linux because a plant engineer's PC is Windows and
    # nobody on this project owns one. Facts, never seconds: every wait in the
    # script is a poll for a state with a generous ceiling.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    # Two plants, each generating an eight-hour shift once and then replaying
    # until a lot has been counted, plus two venvs and two fixture databases.
    # Generous on purpose: a slow runner should not look like a path that does
    # not work.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      # Cheap and first: the folder a person downloads comes out of this same
      # wheel offline, with `plant-from-your-mes/` nested inside it from the one
      # copy in git. Here rather than in a job of its own because the wheel is
      # already built on both runners and a Windows round costs a day.
      - name: The assistant folder out of the wheel, offline
        shell: bash
        run: python .github/scripts/assistant_folder_from_the_wheel.py --wheel "$(ls dist/*.whl)"
      - name: From an unread SQL MES to a running plant, both shapes, offline
        shell: bash
        run: python .github/scripts/plant_from_shape.py --wheel "$(ls dist/*.whl)" --speed 60

  image:
    # The container, built and then run, on every pull request.
    #
    # It did not used to be built here at all. `release.yml` has an `image` job
    # of its own and for months that was the only one, so the Dockerfile was
    # built by a tag or by a release rehearsal and by nothing else. On
    # 2026-10-12 #163 force-included the two plant packs into the wheel, passed
    # all eighteen checks, and left the image unbuildable: `pip install .`
    # inside it could not find `labs/multiplant/bottling/floor.json`, because
    # the Dockerfile copied `src/` and `config/` and no part of `labs/`. The
    # rehearsal found it five hours after the merge. On a tag instead of a
    # dispatch, the same fault would have published 0.3.0 to PyPI and then
    # failed on the image - decision 0018's incident over again, from the other
    # end. A wheel that cannot be installed inside the image is now red on the
    # pull request that breaks it.
    #
    # What this job does that `release.yml`'s cannot: it loads the image and
    # runs the CLI inside it. `load: true` takes a single platform, so this is
    # amd64 - what every runner here and a plant PC have. The second platform
    # is release night's: `release.yml`'s `image` job builds amd64 and arm64
    # through this same Dockerfile and the same buildx, pushes nothing, and
    # keeps the cache its push job reads after the reviewer approves.
    #
    # The two are not a copy of each other and cannot be shared: a single job
    # cannot be `uses:`d, only a whole workflow can. They do not need to be,
    # because `release.yml`'s `test` job already calls this whole file - so on
    # a tag this job runs as well, and the pair reads "it builds for both
    # platforms" and "it runs and carries both packs" rather than one build
    # done twice.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          # Loaded into the daemon, because the steps below run it. Nothing is
          # pushed from this file, ever; `push: false` is not conditional.
          load: true
          tags: fsmes:pr
          # A cache scope of its own. `release.yml`'s `image` job writes the
          # default scope and its `image-push` job reads it, and a pull request
          # must not be able to evict release night's layers.
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image

      - name: What the image weighs
        # Information, never a gate. A number in the log is how anyone reading
        # a release note knows what a `docker pull` costs; a threshold here
        # would be an absolute bound on a shared runner, which says nothing
        # about the code.
        run: |
          set -euo pipefail
          bytes=$(docker image inspect fsmes:pr --format '{{.Size}}')
          echo "image: $bytes bytes ($((bytes / 1024 / 1024)) MB)"

      - name: The image states its version
        run: docker run --rm fsmes:pr fsmes --version

      - name: The image carries both plant packs
        # `fsmes demo --help` names the packs the installation carries, read out
        # of `fsmes/data/packs` and never typed into the CLI - so this asserts
        # the wheel's force-include list from inside the container, which is
        # the exact thing that was broken. A checkout carries no pack and the
        # same help says "none in this installation"; the image must name both.
        #
        # The width is said out loud and the help is squashed to one line
        # before it is read: the help is painted, it wraps to the terminal, and
        # the names sit inside a parenthesis in the middle of a sentence.
        # Asserting on painted output without pinning the width is how #163
        # spent a CI round (2026-10-12).
        run: |
          set -euo pipefail
          help=$(docker run --rm -e COLUMNS=200 fsmes:pr fsmes demo --help)
          echo "$help"
          flat=$(printf '%s' "$help" | tr -s '[:space:]' ' ')
          for pack in bottling machining; do
            case "$flat" in
              *"$pack"*) echo "  the image names $pack" ;;
              *) echo "::error::fsmes demo --help inside the image does not name $pack - the image is missing that pack"; exit 1 ;;
            esac
          done

  two-nodes-in-compose:
    # The two-box demo, killed on purpose, on every pull request.
    #
    # `docker/docker-compose.redundant.yml` is one PostgreSQL, one machine
    # layer, two nodes of the bottling plant and nginx in front of them, and
    # `scripts/kill-a-node.sh` kills one node and checks the other carried
    # on: the reader lease moved within three leases, the counters kept
    # moving, every machine booked exactly what it counted, no reading was
    # stored twice, and the one address kept answering. It is the same claim
    # `postgres`'s two-node test makes, made through containers and a proxy
    # instead of two processes - which is what anybody who tries this product
    # will actually run.
    #
    # Linux only. `docker compose` on the Windows runner has no Linux daemon
    # to run these images on, and a plant engineer's Windows box is covered by
    # `half-dead-plant` and `two-nodes-on-windows` instead.
    #
    # Behind `image`: there is nothing to learn from a compose demo of an
    # image that does not build, and the layer cache that job wrote makes the
    # build here a cache hit rather than a second four-minute pip install.
    # The timing this job asserts is in lease units measured against the
    # database's own clock, never in seconds on a shared runner.
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the image the compose file names
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: factorysemantics-mes:two-nodes
          # Read-only: `image` owns this scope, and two jobs writing one
          # scope evict each other's layers.
          cache-from: type=gha,scope=ci-image

      - name: Kill one of two nodes and check the plant carried on
        run: bash scripts/kill-a-node.sh

      - name: What the containers said
        # Always, pass or fail: a failover nobody can read the logs of is a
        # green check or a red one and nothing else.
        if: always()
        run: |
          docker compose -f docker/docker-compose.redundant.yml ps -a || true
          docker compose -f docker/docker-compose.redundant.yml logs --no-color --tail 200 || true

      - name: Put it away
        if: always()
        run: docker compose -f docker/docker-compose.redundant.yml down -v || true

  two-nodes-on-windows:
    # Scott, about this release: "must run on windows." Nobody on this
    # project has a Windows machine, so this job is where the two-node
    # machinery is read on one.
    #
    # It names its nodes in the pack, builds the plant once, starts it with
    # `fsmes fleet start`, and checks that both nodes answer `/health` under
    # their own names, that each of the three roles is held by exactly one of
    # them, that `fleet status` names both, and that `fleet stop` stops both.
    # The PostgreSQL is the one the runner image ships - installed and
    # stopped, so the job starts it.
    #
    # What this job does NOT do is kill a node. `Popen.terminate()` on
    # Windows does not go through the plant's own shutdown handler, so a
    # killed node there is a different mechanism from a killed node on Linux
    # and deserves a proof of its own rather than a claim made here. The
    # lease, the takeover in lease units and the counters that must not be
    # booked twice are proven by the `postgres` job and by
    # `two-nodes-in-compose`, both Linux.
    #
    # Windows only: the Linux half of the same claim is the `postgres` job,
    # which runs the whole two-node failover test, and running this script
    # there as well would buy the weaker half of a stronger proof.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Start the PostgreSQL this runner ships
        shell: pwsh
        run: |
          $service = Get-Service -Name "postgresql*" | Select-Object -First 1
          if (-not $service) { throw "this runner image has no PostgreSQL service" }
          Write-Host "service $($service.Name) is $($service.Status)"
          Set-Service -Name $service.Name -StartupType Manual
          Start-Service -Name $service.Name
          $env:PGPASSWORD = "root"
          $ready = $false
          foreach ($try in 1..30) {
            & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 -p 5432 -U postgres
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { throw "PostgreSQL never accepted a connection" }
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -p 5432 -U postgres two_nodes
          if ($LASTEXITCODE -ne 0) { throw "could not create the database" }

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[postgres]"

      - name: Two nodes of one plant, started and stopped by the fleet
        shell: bash
        env:
          # The runner image's own password for its own PostgreSQL. It is in
          # the image's documentation, it is reachable from this job and from
          # nothing else, and the database it opens is deleted with the
          # runner.
          PGPASSWORD: root
        run: |
          python .github/scripts/two_nodes_on_one_box.py \
            --database-url "postgresql+psycopg://postgres:root@127.0.0.1:5432/two_nodes" \
            --speed 60

  lab:
    # The lab's starter experiments, on a runner.
    #
    # These are the only checks here that run the product as a plant rather
    # than as a library: two plants seeded from their packs, an hour of line
    # time each replayed through a real OPC server, read back through the HTTP
    # API and scored against the script the generator obeyed. That is slow and
    # it is the point - nothing else in this file would notice the day
    # `fsmes lab run` stopped producing a readable run, because the only person
    # who runs an experiment runs it by hand.
    #
    # It asserts that a run *happened* and left a directory holding what it
    # says it holds. It does not assert a measurement: a scored run is an
    # instrument reading, and failing a build on one would teach everybody to
    # stop reading it.
    runs-on: ubuntu-latest
    # Every starter replays its whole hour, so the budget grows with the
    # number of them. Raised from 25 when the over-run starter was added, and
    # again when the lost-connection starter was (twenty-five minutes of line
    # time at 20x, plus its seeding and drain).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: The starter experiments run and leave a readable directory
        run: .github/scripts/lab_starters.sh
      - name: Keep the runs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lab-results
          path: lab-results/
          retention-days: 7
          if-no-files-found: warn

  lockfile:
    # `uv.lock` has to still describe `pyproject.toml`.
    #
    # Nothing else in this file would notice if it stopped. Every job above
    # installs with `python -m pip install -e ".[...]"`, which reads
    # `pyproject.toml` and ignores the lock entirely - so a dependency added
    # to `pyproject.toml` without regenerating the lock is green everywhere
    # here and broken for everyone who installs from the lock instead
    # (`deploy/promote.sh`, and anybody running `uv sync`).
    #
    # It failed silently, which is the part worth fixing. `uv sync --frozen`
    # does not error on an extra that is missing from the lock; it installs
    # the extras it can find and says nothing about the one it cannot. That
    # is how `[jev]` was declared on 2026-09-17 and then absent from every
    # `--all-extras` venv made after it, with no red check anywhere.
    #
    # `uv lock --check` resolves nothing and downloads nothing: it re-reads
    # `pyproject.toml` and exits non-zero if the lock does not match it. Runs
    # in seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned the way ruff and the PostgreSQL image are pinned: a green run
      # has to mean the same tool passed. uv writes a lockfile format version
      # of its own, so an unpinned uv here could go red on a lock this pin
      # wrote, or the other way round. Moving the pin is a pull request.
      - run: python -m pip install --upgrade pip && python -m pip install uv==0.12.7
      - name: uv.lock matches pyproject.toml
        run: uv lock --check

  audit:
    # Known-vulnerable pins. Advisory until the first public release has
    # shaken it out; then it becomes required.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Editable install and --skip-editable, without --strict: the package
      # under test is not on PyPI at the version being built (or at all,
      # before the first release), and pip-audit must not count that as a
      # finding. Vulnerabilities in the dependencies still fail the job.
      - run: python -m pip install --upgrade pip pip-audit && python -m pip install -e ".[mcp,agent,postgres]"
      - run: python -m pip_audit --skip-editable
