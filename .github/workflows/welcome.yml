name: Welcome

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  first-interaction:
    runs-on: ubuntu-latest
    steps:
      # THE INPUT NAMES USE UNDERSCORES, NOT HYPHENS. `first-interaction` v1
      # was a Docker container action taking `repo-token`, `issue-message` and
      # `pr-message`. v2 rewrote it in TypeScript and renamed all three to
      # `repo_token`, `issue_message` and `pr_message`
      # (https://github.com/actions/first-interaction/releases/tag/v2.0.0,
      # "Convert from Container to TypeScript Action"; compare action.yml at v1
      # and at v3). The action reads all three with
      # `core.getInput(..., { required: true })`, and it reads them *before* it
      # asks whether this is anyone's first contribution (src/main.ts at v3),
      # so hyphens on v2+ fail this job on every issue and every pull request
      # opened, not only a newcomer's.
      #
      # Which is not how it was found. This job triggers on
      # `pull_request_target`, and that event runs the copy of this file on the
      # base branch — so Dependabot's own bump (#39) went green with the
      # hyphens still in it, because the run used `main`'s v1. A version bump
      # here is proven by the *next* pull request opened after it merges, never
      # by the one that makes it. If a future bump changes the names again,
      # they are in that release's action.yml.
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Thanks for the first issue. The maintainer reads everything and answers within a few days. If this is about a real plant, please make sure nothing in it identifies the plant or its owner — the simulator is the place to reproduce.
          pr_message: |
            Thanks for the first pull request. Checks: every commit signed off (`git commit -s`), `ruff` and `pytest` green, and the house-rules checklist in the template. The maintainer reviews within a few days.
